# Platform/infra entries of the localdev secret store (committed: no real secrets here).
# These defaults are enough to run without a secrets.store.toml: sign in as admin/admin, no Google.
# Override in your gitignored secrets.store.toml ("" = required there). Components add their own
# in components/<c>/secrets.defaults.toml.
# Consumers read these through ExternalSecrets on ClusterSecretStore `localdev` (see the docs: Secrets).

[sso]                          # oauth2-proxy: Google OAuth client + cookie secret (readme: Google OAuth setup)
# dev-only placeholders so oauth2-proxy starts (its form is the admin login); the Google button
# fails at Google (invalid_client) until you set a real client in secrets.store.toml
google-client-id = "localdev-unset.apps.googleusercontent.com"
google-client-secret = "localdev-unset"
cookie-secret = "E_RTN6zd9SzKsHmvXcsLGrV-2wxWk0rMCFQiuJqdSSM="   # yours: openssl rand -base64 32 | tr -- '+/' '-_'

[sso-access]                   # who may sign in with Google (oauth2-proxy); set yours in secrets.store.toml
emails = []                    # exact addresses: ["you@gmail.com", "teammate@example.com"]
domains = ["dematic.dev"]      # "example.com": anyone @example.com; ".example.com": any subdomain of it
                               # (not example.com itself); "*": any Google account - see the docs (Secrets)

[localdev-admin]               # local sign-in (oauth2-proxy form), Grafana admin, Keycloak bootstrap admin
username = "admin"
password = "admin"

[api-whoami]                   # API keys for http://api.localhost/whoami/ (the api-auth example)
api-key = "localdev-whoami-key"   # more keys: any name starting with api-key (api-key-2, api-key-ci, ...)
