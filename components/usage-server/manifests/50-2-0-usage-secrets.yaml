# usage server secrets. Only the Postgres admin login comes from the secret store; the server's own
# logins are internal to this app, so they're generated here (ESO Password generators, refreshPolicy
# OnChange: made when the ExternalSecret is created or edited, never rotated) and never leave the cluster:
#   usage-db-app (ns usage): the CONNECTION the server uses: host, port, dbname, username, password,
#     uri (+ user), the keys of CloudNativePG's <cluster>-app secret. The Deployment reads only this.
#   usage-db-ro (ns usage): the read-only login (usage_ro), plus Grafana's datasource for it
#     (usage-datasource.yaml, label grafana_datasource=1: Grafana's sidecar watches every namespace).
#   usage-db-admin (ns usage): the Postgres admin login (store entry postgres-app). Only the init Job
#     reads it (50-2-1-usage-db-init.yaml).
# The init Job (re)sets both passwords from these Secrets, so a regenerated Secret (new cluster, or the
# ExternalSecret edited or recreated) is put right by the next run: mise run db-init.
apiVersion: v1
kind: Namespace
metadata:
  name: usage
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: usage-db-app
  namespace: usage
spec:
  length: 32
  symbols: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-app
  namespace: usage
spec:
  refreshPolicy: OnChange       # generated when this spec changes, never on a timer (then: mise run db-init)
  target:
    name: usage-db-app
    template:
      engineVersion: v2
      data:
        host: postgres-rw.postgres.svc
        port: "5432"
        dbname: usage
        username: usage
        user: usage
        password: "{{ .password }}"
        uri: "postgresql://usage:{{ .password }}@postgres-rw.postgres.svc:5432/usage"
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: usage-db-app}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: usage-db-ro
  namespace: usage
spec:
  length: 32
  symbols: 0                     # no "$": Grafana expands $VAR in provisioning files
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-ro
  namespace: usage
spec:
  refreshPolicy: OnChange       # generated when this spec changes, never on a timer (then: mise run db-init)
  target:
    name: usage-db-ro
    template:
      engineVersion: v2
      metadata:
        labels: {grafana_datasource: "1"}   # Grafana's sidecar loads usage-datasource.yaml (*.yaml only)
      data:
        username: usage_ro
        password: "{{ .password }}"
        usage-datasource.yaml: |
          apiVersion: 1
          datasources:
            - name: Usage
              uid: usage-pg
              type: grafana-postgresql-datasource
              url: postgres-rw.postgres.svc:5432
              user: usage_ro
              jsonData: {database: usage, sslmode: disable, postgresVersion: 1500}
              secureJsonData: {password: "{{ .password }}"}
  dataFrom:
    - sourceRef:
        generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: usage-db-ro}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-admin
  namespace: usage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: usage-db-admin
    template:
      engineVersion: v2
      data:
        host: postgres-rw.postgres.svc
        port: "5432"
        dbname: app
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: postgres-app, property: username}}
    - {secretKey: password, remoteRef: {key: postgres-app, property: password}}
