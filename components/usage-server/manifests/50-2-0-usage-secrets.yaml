# usage server secrets, synced from the secret store (secrets.defaults.toml, postgres-app):
#   usage-db-app (ns usage): the CONNECTION the server uses: host, port, dbname, username, password,
#     uri (+ user), the keys of CloudNativePG's <cluster>-app secret. The Deployment reads only this.
#   usage-db-ro (ns usage): Grafana's read-only login, for the init Job to create.
#   usage-db-admin (ns usage): the Postgres admin login (postgres-app). Only the init Job reads it
#     (50-2-1-usage-db-init.yaml).
#   usage-grafana-datasource (ns monitoring): a Grafana datasource for the read-only login, picked
#     up live by Grafana's datasource sidecar (label grafana_datasource=1).
apiVersion: v1
kind: Namespace
metadata:
  name: usage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-app
  namespace: usage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: usage-db-app
    template:
      engineVersion: v2
      data:
        host: postgres-rw.postgres.svc
        port: "5432"
        dbname: usage
        username: "{{ .username }}"
        user: "{{ .username }}"
        password: "{{ .password }}"
        uri: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.postgres.svc:5432/usage"
  data:
    - {secretKey: username, remoteRef: {key: cluster-usage-db, property: username}}
    - {secretKey: password, remoteRef: {key: cluster-usage-db, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-ro
  namespace: usage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: usage-db-ro}
  data:
    - {secretKey: username, remoteRef: {key: cluster-usage-ro, property: username}}
    - {secretKey: password, remoteRef: {key: cluster-usage-ro, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db-admin
  namespace: usage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: usage-db-admin
    template:
      engineVersion: v2
      data:
        host: postgres-rw.postgres.svc
        port: "5432"
        dbname: app
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - {secretKey: username, remoteRef: {key: postgres-app, property: username}}
    - {secretKey: password, remoteRef: {key: postgres-app, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-grafana-datasource
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: usage-grafana-datasource
    template:
      engineVersion: v2
      metadata:
        labels: {grafana_datasource: "1"}
      data:
        usage-datasource.yaml: |
          apiVersion: 1
          datasources:
            - name: Usage
              uid: usage-pg
              type: grafana-postgresql-datasource
              url: postgres-rw.postgres.svc:5432
              user: {{ .username }}
              jsonData: {database: usage, sslmode: disable, postgresVersion: 1500}
              secureJsonData: {password: "{{ .password }}"}
  data:
    - {secretKey: username, remoteRef: {key: cluster-usage-ro, property: username}}
    - {secretKey: password, remoteRef: {key: cluster-usage-ro, property: password}}
