# usage server: write-only ingest of tool-usage events (../openapi.yaml) into database `usage`
# on postgres/postgres.
#   desktop:     http://api.localhost/usage/v1/events     (the API host; open: no API key yet)
#   in cluster:  http://usage.usage.svc/v1/events
#   build:       mise run build usage-server   (build.sh)
# The server only knows Secret usage-db-app (host, port, dbname, username, password): the contract
# with whatever provisioned its database, here the Job in 50-2-1-usage-db-init.yaml, elsewhere e.g.
# CloudNativePG. It retries until that database answers, then applies its own schema migrations.
apiVersion: v1
kind: Namespace
metadata:
  name: usage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage
  namespace: usage
  # localdev/component: localdev's cnav lists this in its status column (group: apps)
  labels: {app: usage, localdev/component: usage-server}
  annotations: {reloader.stakater.com/auto: "true"}   # roll when usage-db-app changes (e.g. regenerated)
spec:
  replicas: 1
  selector:
    matchLabels: {app: usage}
  template:
    metadata:
      # metrics: enabled -> Prometheus scrapes the port named "metrics" (localdev convention)
      labels: {app: usage, metrics: enabled}
    spec:
      enableServiceLinks: false
      containers:
        - name: usage
          image: localdev-registry:5005/usage-server:latest
          imagePullPolicy: Always
          env:
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: usage-db-app, key: host}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: usage-db-app, key: port}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: usage-db-app, key: dbname}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: usage-db-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: usage-db-app, key: password}}
            - {name: USAGE_LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          readinessProbe:       # includes the database: no traffic while it's unreachable
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:        # process only: a database outage must not restart the server
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: usage
  namespace: usage
spec:
  selector: {app: usage}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip
  namespace: usage
spec:
  stripPrefix:
    prefixes: [/usage]
---
# On the API host (components/api-auth): clients are tools, not browsers, so no SSO.
# Open for now; to require API keys, put api-key@kubernetescrd first in the middlewares and add an
# [api-usage] entry (api-key = "...") to secrets.defaults.toml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usage
  namespace: usage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: usage-strip@kubernetescrd
spec:
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /usage
            pathType: Prefix
            backend:
              service:
                name: usage
                port: {name: http}
