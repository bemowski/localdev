<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signed Out</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<!-- Served outside SSO (see the cnav-public Ingress), so it must stay self-contained. -->
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb; --accent: #3b6fd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c24; --text: #e6e9ef; --muted: #8b93a3; --border: #272c36; --accent: #7aa2f7; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .box {
    max-width: 420px; width: 100%; padding: 32px 28px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  }
  .icon { font-size: 48px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  a.btn {
    display: inline-block; margin-top: 8px; padding: 8px 18px; border-radius: 8px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  a.google { color: var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">👋</div>
    <h1>Signed out of localdev</h1>
    <p>Your localdev SSO session has ended.</p>
    <p>You're still signed in to Google, so signing in again won't ask for a password.
       To switch accounts, <a class="google" href="https://accounts.google.com/Logout">sign out of Google</a> first.</p>
    <a class="btn" href="/">Sign in again</a>
  </div>
</body>
</html>
