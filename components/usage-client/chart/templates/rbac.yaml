# read-only: cluster identity (kube-system UID), nodes, pod/namespace counts, Deployments, and localdev's
# two ConfigMaps (absent elsewhere: 404, fine)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usage-client.name" . }}
  labels: {{- include "usage-client.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "usage-client.clusterName" . }}
  labels: {{- include "usage-client.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [localdev-host, localdev-profile]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "usage-client.clusterName" . }}
  labels: {{- include "usage-client.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "usage-client.clusterName" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "usage-client.name" . }}, namespace: {{ .Release.Namespace }}}
