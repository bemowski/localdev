# usage entries of the localdev secret store (fixed dev values; override in secrets.store.toml).
# cluster-usage-db: the server's own login, owner of database `usage`. cluster-usage-ro: Grafana's read-only login.
[cluster-usage-db]
username = "usage"
password = "usage"

[cluster-usage-ro]
username = "usage_ro"
password = "usage_ro"
