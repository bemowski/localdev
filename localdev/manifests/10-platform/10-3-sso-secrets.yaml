# oauth2-proxy's secrets, synced from the secret store (ClusterSecretStore localdev) by the
# External Secrets Operator. Kept apart from 10-2-oauth2-proxy.yaml: on a fresh cluster this file
# waits for ESO's CRDs (k3s retries it) without holding up oauth2-proxy's own manifests.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: oauth2-proxy}
  data:
    - {secretKey: client-id, remoteRef: {key: sso, property: google-client-id}}
    - {secretKey: client-secret, remoteRef: {key: sso, property: google-client-secret}}
    - {secretKey: cookie-secret, remoteRef: {key: sso, property: cookie-secret}}
---
# local sign-in: htpasswd line (bcrypt) built from localdev-admin by ESO's template. OnChange:
# only re-rendered when this ExternalSecret changes (secrets:sync's force-sync annotation does
# that), so bcrypt's random salt doesn't rewrite the Secret on every refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-htpasswd
  namespace: auth
spec:
  refreshPolicy: OnChange
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: oauth2-proxy-htpasswd
    template:
      data:
        users.txt: '{{ htpasswd .username .password "bcrypt" }}'
  data:
    - {secretKey: username, remoteRef: {key: localdev-admin, property: username}}
    - {secretKey: password, remoteRef: {key: localdev-admin, property: password}}
---
# who may sign in with Google: [sso-access] in the store (lists, one item per line).
#   allowed-emails: mounted as oauth2-proxy's authenticated-emails-file (one address per line)
#   email-domains:  comma-joined for --email-domain (pflag string slice)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-access
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: oauth2-proxy-access
    template:
      data:
        allowed-emails: '{{ .emails }}'
        email-domains: '{{ .domains | splitList "\n" | compact | join "," }}'
  data:
    - {secretKey: emails, remoteRef: {key: sso-access, property: emails}}
    - {secretKey: domains, remoteRef: {key: sso-access, property: domains}}
