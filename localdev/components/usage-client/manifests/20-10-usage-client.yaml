# usage-client: watches this cluster and sends usage events (cluster created, heartbeat
# with cluster size, profile changed, app deployed) to a usage server. Best-effort: events spool in an emptyDir.
# Always on in localdev (profiles.toml), whether or not a usage server is running: without one, events
# wait in the spool (72h / 1000 files) and the agent logs one warning.
#   build: mise run build usage-client      code: docker/agent.py
#   optional: ConfigMap kube-system/localdev-host (host facts, written by localdev's tasks). Without it
#   the facts are "unknown"; cluster.updated backfills them when it appears.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-client
  namespace: kube-system
---
# read-only: cluster identity, nodes, pod/namespace counts, the two localdev ConfigMaps, Deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: usage-client
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, pods]           # pods: counted for the heartbeat (metadata only)
    verbs: [list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [localdev-host, localdev-profile]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: usage-client
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: usage-client}
subjects:
  - {kind: ServiceAccount, name: usage-client, namespace: kube-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-client
  namespace: kube-system
  # localdev/component + status-group: a row in cnav's infra group
  labels: {app: usage-client, localdev/component: usage-client, localdev/status-group: infra}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: usage-client}
  template:
    metadata:
      labels: {app: usage-client}
    spec:
      serviceAccountName: usage-client
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10      # SIGTERM: one last flush, then exit
      containers:
        - name: usage-client
          image: localdev-registry:5005/usage-client:latest
          imagePullPolicy: Always
          env:
            # where a usage server runs: the in-cluster one (usage-server component) for now; later a public endpoint
            - {name: USAGE_URL, value: "http://usage.usage.svc"}
          volumeMounts:
            - {name: spool, mountPath: /spool}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: spool                          # ephemeral: losing events on a restart is fine
          emptyDir: {sizeLimit: 20Mi}
