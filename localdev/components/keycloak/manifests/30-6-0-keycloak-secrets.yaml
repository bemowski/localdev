# Keycloak's secrets, synced from the secret store: its DB login (keycloak-db), the Postgres login
# its init container uses to create that DB (postgres-app), and the bootstrap admin (localdev-admin).
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: keycloak-db}
  data:
    - {secretKey: username, remoteRef: {key: keycloak-db, property: username}}
    - {secretKey: password, remoteRef: {key: keycloak-db, property: password}}
    - {secretKey: pg-admin-user, remoteRef: {key: postgres-app, property: username}}
    - {secretKey: pg-admin-password, remoteRef: {key: postgres-app, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: keycloak-admin}
  data:
    - {secretKey: username, remoteRef: {key: localdev-admin, property: username}}
    - {secretKey: password, remoteRef: {key: localdev-admin, property: password}}
