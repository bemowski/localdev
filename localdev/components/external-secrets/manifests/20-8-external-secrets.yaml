# External Secrets Operator (ESO): syncs secrets from a secret manager into Kubernetes Secrets.
# Every localdev secret is mastered in ONE store, ClusterSecretStore `localdev` (below); each
# consumer owns an ExternalSecret reading from it. Today the store is ESO's Kubernetes provider over
# namespace secret-store, which `mise run secrets:sync` fills from secrets.defaults.toml files +
# the gitignored secrets.store.toml. Moving to a cloud store (e.g. GCP Secret Manager) = changing
# this store's spec only. See the docs (Secrets page).
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: external-secrets
  namespace: kube-system
spec:
  repo: https://charts.external-secrets.io
  chart: external-secrets
  version: 2.11.0
  targetNamespace: external-secrets
  createNamespace: true
  valuesContent: |-
    installCRDs: true
    podLabels: {metrics: enabled}          # scraped by Prometheus (20-4-scrape: port "metrics")
    resources:
      requests: {cpu: 10m, memory: 48Mi}
    webhook:
      podLabels: {metrics: enabled}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
    certController:
      podLabels: {metrics: enabled}
      resources:
        requests: {cpu: 10m, memory: 48Mi}
---
# The local backing of store `localdev`: plain Secrets in this namespace (`mise run secrets:sync`)
apiVersion: v1
kind: Namespace
metadata:
  name: secret-store
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-reader
  namespace: secret-store
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-reader
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-reader
  namespace: secret-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: store-reader
subjects:
  - kind: ServiceAccount
    name: store-reader
    namespace: secret-store
---
# ESO checks the store's permissions with a SelfSubjectRulesReview before marking it Valid
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-store-reader-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-store-reader-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-store-reader-review
subjects:
  - kind: ServiceAccount
    name: store-reader
    namespace: secret-store
---
# remoteRef.key = Secret name in secret-store, remoteRef.property = key in it
# (applied before the chart's CRDs exist: k3s retries the file until it applies)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: localdev           # the name every ExternalSecret uses: keep it when the backing changes
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-store
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secret-store
      auth:
        serviceAccount:
          name: store-reader
          namespace: secret-store
