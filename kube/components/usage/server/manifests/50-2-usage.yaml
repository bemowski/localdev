# usage server: write-only ingest of tool-usage events (../../openapi.yaml) into database `usage`
# on postgres/postgres.
#   desktop:     http://api.localhost/usage/v1/events     (the API host; open: no API key yet)
#   in cluster:  http://usage.usage.svc/v1/events
#   build:       mise run build usage   (server/build.sh)
# The init container creates the server's role and database, and Grafana's read-only role, with
# passwords from the usage-db secret (50-2-0-usage-secrets.yaml). The server applies its own
# schema migrations at startup.
apiVersion: v1
kind: Namespace
metadata:
  name: usage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage
  namespace: usage
  # localdev/component: localdev's cnav lists this in its status column (group: apps)
  labels: {app: usage, localdev/component: usage}
spec:
  replicas: 1
  selector:
    matchLabels: {app: usage}
  template:
    metadata:
      # metrics: enabled -> Prometheus scrapes the port named "metrics" (localdev convention)
      labels: {app: usage, metrics: enabled}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: create-db       # idempotent: roles + database on postgres/postgres
          image: postgres:18.6
          env:
            - {name: PGHOST, value: postgres-rw.postgres.svc}
            - {name: PGDATABASE, value: app}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: usage-db, key: pg-admin-user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: usage-db, key: pg-admin-password}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: usage-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: usage-db, key: password}}
            - name: RO_USER
              valueFrom: {secretKeyRef: {name: usage-db, key: ro-username}}
            - name: RO_PASSWORD
              valueFrom: {secretKeyRef: {name: usage-db, key: ro-password}}
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -v user="$DB_USER" -v pw="$DB_PASSWORD" -v ro="$RO_USER" -v ro_pw="$RO_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'user') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user')\gexec
              ALTER ROLE :"user" PASSWORD :'pw';
              SELECT format('CREATE ROLE %I LOGIN', :'ro') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'ro')\gexec
              ALTER ROLE :"ro" PASSWORD :'ro_pw';
              SELECT format('CREATE DATABASE usage OWNER %I', :'user') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'usage')\gexec
              GRANT CONNECT ON DATABASE usage TO :"ro";
              \connect usage
              -- read-only role: everything in public, now and in future tables the server creates
              GRANT USAGE ON SCHEMA public TO :"ro";
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"ro";
              ALTER DEFAULT PRIVILEGES FOR ROLE :"user" IN SCHEMA public GRANT SELECT ON TABLES TO :"ro";
              SQL
              echo "usage roles + database ready"
      containers:
        - name: usage
          image: localdev-registry:5005/usage:latest
          imagePullPolicy: Always
          env:
            - {name: PGHOST, value: postgres-rw.postgres.svc}
            - {name: PGPORT, value: "5432"}
            - {name: PGDATABASE, value: usage}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: usage-db, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: usage-db, key: password}}
            - {name: USAGE_LOG_LEVEL, value: info}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          readinessProbe:       # includes the database: no traffic while it's unreachable
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:        # process only: a database outage must not restart the server
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: usage
  namespace: usage
spec:
  selector: {app: usage}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip
  namespace: usage
spec:
  stripPrefix:
    prefixes: [/usage]
---
# On the API host (components/api-auth in kube/localdev): clients are tools, not browsers, so no SSO.
# Open for now; to require API keys, put api-key@kubernetescrd first in the middlewares and add an
# [api-usage] entry (api-key = "...") to server/secrets.defaults.toml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usage
  namespace: usage
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: usage-strip@kubernetescrd
spec:
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /usage
            pathType: Prefix
            backend:
              service:
                name: usage
                port: {name: http}
