# usage server secrets, synced from the secret store (server/secrets.defaults.toml):
#   usage-db (ns usage): the server's login, Grafana's read-only login (the init container sets
#     both passwords) and the Postgres admin login the init container uses (postgres-app).
#   usage-grafana-datasource (ns monitoring): a Grafana datasource for the read-only login, picked
#     up live by Grafana's datasource sidecar (label grafana_datasource=1).
apiVersion: v1
kind: Namespace
metadata:
  name: usage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-db
  namespace: usage
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: usage-db}
  data:
    - {secretKey: username, remoteRef: {key: usage-db, property: username}}
    - {secretKey: password, remoteRef: {key: usage-db, property: password}}
    - {secretKey: ro-username, remoteRef: {key: usage-ro, property: username}}
    - {secretKey: ro-password, remoteRef: {key: usage-ro, property: password}}
    - {secretKey: pg-admin-user, remoteRef: {key: postgres-app, property: username}}
    - {secretKey: pg-admin-password, remoteRef: {key: postgres-app, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: usage-grafana-datasource
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: usage-grafana-datasource
    template:
      engineVersion: v2
      metadata:
        labels: {grafana_datasource: "1"}
      data:
        usage-datasource.yaml: |
          apiVersion: 1
          datasources:
            - name: Usage
              uid: usage-pg
              type: grafana-postgresql-datasource
              url: postgres-rw.pg.svc:5432
              user: {{ .username }}
              jsonData: {database: usage, sslmode: disable, postgresVersion: 1500}
              secureJsonData: {password: "{{ .password }}"}
  data:
    - {secretKey: username, remoteRef: {key: usage-ro, property: username}}
    - {secretKey: password, remoteRef: {key: usage-ro, property: password}}
