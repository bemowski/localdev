openapi: 3.1.0
info:
  title: Usage events API
  version: 1.0.0
  summary: Write-only API for recording how people use internal tools.
  description: |
    Clients (agents built into tools and clusters) send **events**, each describing something
    that happened: a cluster created, an app deployed, a test suite run. The server stores them in Postgres. There is no read API: reporting goes through
    the database (Grafana dashboards).

    ## Delivery model
    - Clients write events to a local spool and flush them in batches, asynchronously. A tool
      never waits on, or fails because of, this API.
    - **Batches are all-or-nothing.** If any event is invalid, the whole batch is rejected (422)
      with the failing indexes, and nothing is stored.
    - **`event_id` is the idempotency key.** It is generated by the client, once per event. Resending
      an event the server already has is not an error: it is counted under `duplicates`.
      Retrying after a timeout is therefore always safe.

    ## Event shape
    Every event has the same envelope (`event_id`, `type`, `occurred_at`, `username`, `source`)
    and a `data` object whose schema is chosen by `type`. Type names are dotted:
    `<entity>.<verb>`, e.g. `cluster.created`.

    ## Clusters
    A cluster has a **type** (`localdev`: a developer's local cluster; `ephemeral`: short-lived, e.g.
    per CI run; `durable`: long-lived, shared) and a **role** (`dev`, `test`, `stage`, `prod`,
    `perftest`), both set in `cluster.created`. Other cluster events refer to their cluster by
    `cluster_id` only.

    ## Versioning
    - **Additive changes keep v1:** a new event type (a new schema plus a discriminator mapping), or a
      new optional field.
    - **Breaking changes get a new name:** removing or renaming a field, or making one required,
      requires a new type name (`cluster.created.v2`) or a `/v2` path.
    - The server rejects types it does not know (422). Clients keep such events spooled, so they are
      delivered once the server is upgraded.
  license:
    name: Internal
    identifier: LicenseRef-Internal

servers:
  - url: http://localhost/usage/api
    description: localdev cluster, from the desktop
  - url: http://usage.usage.svc
    description: localdev cluster, from inside the cluster

tags:
  - name: events
    description: Submit usage events
  - name: operations
    description: Health and self-description

paths:
  /v1/events:
    post:
      operationId: submitEvents
      tags: [events]
      summary: Submit a batch of events
      description: |
        Stores 1 to 500 events in one transaction. The request body may be at most 1 MiB.
        The response says how many events were new (`accepted`) and how many the server already
        had (`duplicates`). `accepted + duplicates` always equals the batch size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            examples:
              clusterLifecycle:
                summary: A cluster created, a heartbeat, an ad-hoc event, and the cluster destroyed
                value:
                  events:
                    - event_id: 0f8e6d2a-3b1c-4e5f-9a7b-1c2d3e4f5a6b
                      type: cluster.created
                      occurred_at: '2026-10-10T14:03:22Z'
                      username: alice
                      source: {name: localdev-cluster-agent, version: 0.2.0}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        cluster_type: localdev
                        cluster_role: dev
                        platform: k3d
                        platform_version: v5.9.0
                        kubernetes_version: v1.36.5+k3s1
                        arch: amd64
                        profile: dev
                        components: [postgres, nats, docs]
                        os: windows
                        os_variant: wsl2
                        os_version: Ubuntu 24.04
                    - event_id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                      type: cluster.heartbeat
                      occurred_at: '2026-10-10T14:18:22Z'
                      username: alice
                      source: {name: localdev-cluster-agent, version: 0.2.0}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        nodes: 1
                        cores: 8
                        memory_bytes: 16777216000
                        pods: 42
                        namespaces: 14
                    - event_id: 5a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      type: cluster.event
                      occurred_at: '2026-10-10T14:20:05Z'
                      username: alice
                      source: {name: localdev-cluster-agent, version: 0.2.0}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        name: tests.run
                        outcome: success
                        duration_ms: 48210
                        attributes: {suite: smoke, passed: 42, failed: 0}
                    - event_id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                      type: cluster.destroyed
                      occurred_at: '2026-10-10T17:45:00Z'
                      username: alice
                      source: {name: localdev-client, version: de78fa6}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '202':
          description: The batch was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
              example: {accepted: 2, duplicates: 1}
        '400':
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: malformed_request, message: 'Body is not valid JSON'}
        '413':
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: too_large, message: 'Request body exceeds 1048576 bytes'}
        '422':
          description: |
            At least one event is invalid. Nothing was stored. `details` lists every problem,
            with the index of the event in `events` (absent for problems with the batch itself).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_failed
                message: 2 events are invalid
                details:
                  - {index: 0, path: data.os, message: "'solaris' is not one of [linux, macos, windows]"}
                  - {index: 3, path: type, message: "unknown event type 'cluster.paused'"}
        '503':
          description: The server cannot reach its database. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ping:
    get:
      operationId: ping
      tags: [operations]
      summary: Reachability check
      description: Always 200 while the server is up. Doesn't touch the database (see /healthz).
      responses:
        '200':
          description: Pong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
              example: {ping: pong}

  /healthz:
    get:
      operationId: health
      tags: [operations]
      summary: Liveness and readiness
      description: 200 when the server is up and its database is reachable, otherwise 503.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: ok}
        '503':
          description: Unhealthy (e.g. database unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: unavailable}

  /openapi.yaml:
    get:
      operationId: getSpec
      tags: [operations]
      summary: This specification
      responses:
        '200':
          description: The OpenAPI document the server implements.
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    # ---------- batch ----------
    EventBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Event'

    Event:
      description: One usage event. `type` selects the schema.
      oneOf:
        - $ref: '#/components/schemas/ClusterCreated'
        - $ref: '#/components/schemas/ClusterUpdated'
        - $ref: '#/components/schemas/ClusterDestroyed'
        - $ref: '#/components/schemas/ClusterEvent'
        - $ref: '#/components/schemas/ClusterHeartbeat'
      discriminator:
        propertyName: type
        mapping:
          cluster.created: '#/components/schemas/ClusterCreated'
          cluster.updated: '#/components/schemas/ClusterUpdated'
          cluster.destroyed: '#/components/schemas/ClusterDestroyed'
          cluster.event: '#/components/schemas/ClusterEvent'
          cluster.heartbeat: '#/components/schemas/ClusterHeartbeat'

    BatchResult:
      type: object
      required: [accepted, duplicates]
      additionalProperties: false
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Events stored by this request.
        duplicates:
          type: integer
          minimum: 0
          description: Events whose `event_id` the server already had (ignored, not an error).

    # ---------- envelope ----------
    EventEnvelope:
      description: |
        Fields common to every event. Each event type combines this with its own `type` constant
        and `data` schema. Unknown fields are rejected.
      type: object
      required: [event_id, type, occurred_at, username, source, data]
      properties:
        event_id:
          type: string
          format: uuid
          description: Generated by the client, once per event. The idempotency key.
        type:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*)+$'
          description: '`<entity>.<verb>`. See the event schemas for the known types.'
        occurred_at:
          type: string
          format: date-time
          description: When it happened, by the client's clock (RFC 3339). The server records its own receive time separately.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Login name of the person using the tool (e.g. `$USER`).
        source:
          $ref: '#/components/schemas/Source'
        data:
          type: object

    Source:
      type: object
      description: The client that emitted the event.
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          examples: [localdev-client]
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Client version or git commit.
          examples: [de78fa6, 1.2.0]

    # ---------- shared fields ----------
    ClusterId:
      type: string
      format: uuid
      description: |
        Identifies one cluster, from creation to destruction. For Kubernetes clusters, the UID of
        the `kube-system` namespace.

    ClusterType:
      type: string
      enum: [localdev, ephemeral, durable, unknown]
      description: |
        `localdev`: a developer's local cluster. `ephemeral`: short-lived (e.g. per CI run or
        review app). `durable`: long-lived and shared. `unknown`: not reported (yet); a later
        `cluster.updated` may fill it in.

    ClusterRole:
      type: string
      enum: [dev, test, stage, prod, perftest, unknown]
      description: 'What the cluster is used for. `unknown`: not reported (yet), see `ClusterType`.'

    Version:
      type: string
      pattern: '^v?\d+\.\d+(\.\d+)?([-+][0-9A-Za-z.+-]+)?$'
      maxLength: 64

    Count:
      type: integer
      minimum: 0

    Platform:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
      description: Kubernetes distribution or tool that runs the cluster.
      examples: [k3d, k3s, kind, eks, gke, aks]

    Arch:
      type: string
      enum: [amd64, arm64]

    Os:
      type: string
      enum: [linux, macos, windows]
      description: "*localdev*: the developer's operating system. WSL counts as `windows`."

    OsVariant:
      type: string
      maxLength: 64
      description: '*localdev*: refinement of `os`, such as `wsl2`, a Linux distribution id, or the macOS Docker runtime (`rancher-desktop`).'
      examples: [wsl2, ubuntu, fedora, rancher-desktop]

    OsVersion:
      type: string
      minLength: 1
      maxLength: 64
      description: '*localdev*: release of the OS (for `wsl2`, the Linux distribution inside it).'
      examples: ['24.04', '15.6.1', 'Ubuntu 24.04']

    # ---------- clusters ----------
    ClusterCreated:
      title: cluster.created
      description: |
        A cluster was created. Sent once per cluster; the facts here are stored on the cluster and
        not repeated by its other events. Fields marked *localdev* only apply to `localdev` clusters.
        Facts the sender doesn't know yet are `unknown` (type, role) or left out (optional fields);
        `cluster.updated` fills them in later.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: cluster.created
            data:
              type: object
              required: [cluster_id, cluster_type, cluster_role, platform, kubernetes_version]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                cluster_type:
                  $ref: '#/components/schemas/ClusterType'
                cluster_role:
                  $ref: '#/components/schemas/ClusterRole'
                platform:
                  $ref: '#/components/schemas/Platform'
                platform_version:
                  $ref: '#/components/schemas/Version'
                kubernetes_version:
                  $ref: '#/components/schemas/Version'
                arch:
                  $ref: '#/components/schemas/Arch'
                profile:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                  description: '*localdev*: profile the cluster was created with.'
                  examples: [dev, full]
                components:
                  type: array
                  description: '*localdev*: components enabled by the profile.'
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                os:
                  $ref: '#/components/schemas/Os'
                os_variant:
                  $ref: '#/components/schemas/OsVariant'
                os_version:
                  $ref: '#/components/schemas/OsVersion'
      unevaluatedProperties: false

    ClusterUpdated:
      title: cluster.updated
      description: |
        Facts about a cluster changed or became known, e.g. a cluster that reported `unknown` in
        `cluster.created` because its facts weren't available yet. The fields sent replace the
        stored ones; fields left out stay as they are. The envelope's `username` becomes the
        cluster's username, unless it is `unknown`. Sending the same facts again is harmless.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: cluster.updated
            data:
              type: object
              required: [cluster_id]
              minProperties: 2
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                cluster_type:
                  $ref: '#/components/schemas/ClusterType'
                cluster_role:
                  $ref: '#/components/schemas/ClusterRole'
                platform:
                  $ref: '#/components/schemas/Platform'
                platform_version:
                  $ref: '#/components/schemas/Version'
                kubernetes_version:
                  $ref: '#/components/schemas/Version'
                arch:
                  $ref: '#/components/schemas/Arch'
                os:
                  $ref: '#/components/schemas/Os'
                os_variant:
                  $ref: '#/components/schemas/OsVariant'
                os_version:
                  $ref: '#/components/schemas/OsVersion'
      unevaluatedProperties: false

    ClusterDestroyed:
      title: cluster.destroyed
      description: A cluster was destroyed.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: cluster.destroyed
            data:
              type: object
              required: [cluster_id]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
      unevaluatedProperties: false

    ClusterHeartbeat:
      title: cluster.heartbeat
      description: |
        Periodic sign of life from a running cluster, with its size at that moment. Clusters can't
        always report their own destruction, so the last heartbeat is when the cluster was last seen.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: cluster.heartbeat
            data:
              type: object
              required: [cluster_id, nodes, cores, memory_bytes, pods, namespaces]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                nodes:
                  $ref: '#/components/schemas/Count'
                cores:
                  type: number
                  minimum: 0
                  description: CPU capacity summed over all nodes.
                memory_bytes:
                  type: integer
                  minimum: 0
                  description: Memory capacity summed over all nodes.
                pods:
                  $ref: '#/components/schemas/Count'
                namespaces:
                  $ref: '#/components/schemas/Count'
      unevaluatedProperties: false

    ClusterEvent:
      title: cluster.event
      description: |
        An ad-hoc event attached to a cluster: an app deployed, a test suite run, a profile
        change. `name` says what happened, and `attributes` carries free-form details.
        `outcome` and `duration_ms` are first-class, so the common cases can be aggregated
        without reading `attributes`.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: cluster.event
            data:
              type: object
              required: [cluster_id, name]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                name:
                  type: string
                  pattern: '^[a-z0-9]+(\.[a-z0-9_-]+)*$'
                  maxLength: 128
                  description: Dotted, lower-case event name.
                  examples: [app.deployed, tests.run, profile.changed]
                outcome:
                  type: string
                  enum: [success, failure, cancelled]
                duration_ms:
                  type: integer
                  minimum: 0
                attributes:
                  type: object
                  description: Free-form details. Flat key-value pairs. Values are strings, numbers or booleans.
                  maxProperties: 50
                  propertyNames:
                    pattern: '^[a-z0-9_.-]{1,64}$'
                  additionalProperties:
                    type: [string, number, boolean]
                    maxLength: 1024
      unevaluatedProperties: false

    # ---------- operations ----------
    Pong:
      type: object
      required: [ping]
      additionalProperties: false
      properties:
        ping:
          type: string
          const: pong

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [malformed_request, too_large, validation_failed, unavailable]
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the event in `events`. Absent for problems with the batch itself.
        path:
          type: string
          description: Dotted path of the offending field within the event.
          examples: [data.os]
        message:
          type: string
