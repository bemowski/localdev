openapi: 3.1.0
info:
  title: Usage events API
  version: 1.0.0
  summary: Write-only API for recording how people use internal tools.
  description: |
    Clients (agents built into tools) send **events**, each describing something an end user did
    with a tool. The server stores them in Postgres. There is no read API: reporting goes through
    the database (Grafana dashboards).

    ## Delivery model
    - Clients write events to a local spool and flush them in batches, asynchronously. A tool
      never waits on, or fails because of, this API.
    - **Batches are all-or-nothing.** If any event is invalid, the whole batch is rejected (422)
      with the failing indexes, and nothing is stored.
    - **`event_id` is the idempotency key.** It is generated by the client, once per event. Resending
      an event the server already has is not an error: it is counted under `duplicates`.
      Retrying after a timeout is therefore always safe.

    ## Event shape
    Every event has the same envelope (`event_id`, `type`, `occurred_at`, `username`, `source`)
    and a `data` object whose schema is chosen by `type`. Type names are dotted:
    `<domain>.<entity>.<verb>`, e.g. `localdev.cluster.created`.

    ## Versioning
    - **Additive changes keep v1:** a new event type (a new schema plus a discriminator mapping), or a
      new optional field.
    - **Breaking changes get a new name:** removing or renaming a field, or making one required,
      requires a new type name (`localdev.cluster.created.v2`) or a `/v2` path.
    - The server rejects types it does not know (422). Clients keep such events spooled, so they are
      delivered once the server is upgraded.
  license:
    name: Internal
    identifier: LicenseRef-Internal

servers:
  - url: http://localhost/usage/api
    description: localdev cluster, from the desktop
  - url: http://usage.usage.svc
    description: localdev cluster, from inside the cluster

tags:
  - name: events
    description: Submit usage events
  - name: operations
    description: Health and self-description

paths:
  /v1/events:
    post:
      operationId: submitEvents
      tags: [events]
      summary: Submit a batch of events
      description: |
        Stores 1 to 500 events in one transaction. The request body may be at most 1 MiB.
        The response says how many events were new (`accepted`) and how many the server already
        had (`duplicates`). `accepted + duplicates` always equals the batch size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            examples:
              clusterLifecycle:
                summary: A cluster created, an ad-hoc event, and the cluster destroyed
                value:
                  events:
                    - event_id: 0f8e6d2a-3b1c-4e5f-9a7b-1c2d3e4f5a6b
                      type: localdev.cluster.created
                      occurred_at: '2026-10-10T14:03:22Z'
                      username: alice
                      source: {name: localdev-client, version: de78fa6}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        profile: dev
                        components: [postgres, nats, docs]
                        platform: k3d
                        platform_version: v5.9.0
                        kubernetes_version: v1.33.4+k3s1
                        os: windows
                        os_variant: wsl2
                        os_version: Ubuntu 24.04
                        arch: amd64
                    - event_id: 5a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                      type: localdev.cluster.event
                      occurred_at: '2026-10-10T14:20:05Z'
                      username: alice
                      source: {name: localdev-client, version: de78fa6}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        name: tests.run
                        outcome: success
                        duration_ms: 48210
                        attributes: {suite: smoke, passed: 42, failed: 0}
                    - event_id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                      type: localdev.cluster.destroyed
                      occurred_at: '2026-10-10T17:45:00Z'
                      username: alice
                      source: {name: localdev-client, version: de78fa6}
                      data:
                        cluster_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      responses:
        '202':
          description: The batch was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
              example: {accepted: 2, duplicates: 1}
        '400':
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: malformed_request, message: 'Body is not valid JSON'}
        '413':
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: too_large, message: 'Request body exceeds 1048576 bytes'}
        '422':
          description: |
            At least one event is invalid. Nothing was stored. `details` lists every problem,
            with the index of the event in `events` (absent for problems with the batch itself).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: validation_failed
                message: 2 events are invalid
                details:
                  - {index: 0, path: data.os, message: "'solaris' is not one of [linux, macos, windows]"}
                  - {index: 3, path: type, message: "unknown event type 'localdev.cluster.paused'"}
        '503':
          description: The server cannot reach its database. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /healthz:
    get:
      operationId: health
      tags: [operations]
      summary: Liveness and readiness
      description: 200 when the server is up and its database is reachable, otherwise 503.
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: ok}
        '503':
          description: Unhealthy (e.g. database unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: unavailable}

  /openapi.yaml:
    get:
      operationId: getSpec
      tags: [operations]
      summary: This specification
      responses:
        '200':
          description: The OpenAPI document the server implements.
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    # ---------- batch ----------
    EventBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Event'

    Event:
      description: One usage event. `type` selects the schema.
      oneOf:
        - $ref: '#/components/schemas/LocaldevClusterCreated'
        - $ref: '#/components/schemas/LocaldevClusterDestroyed'
        - $ref: '#/components/schemas/LocaldevClusterEvent'
      discriminator:
        propertyName: type
        mapping:
          localdev.cluster.created: '#/components/schemas/LocaldevClusterCreated'
          localdev.cluster.destroyed: '#/components/schemas/LocaldevClusterDestroyed'
          localdev.cluster.event: '#/components/schemas/LocaldevClusterEvent'

    BatchResult:
      type: object
      required: [accepted, duplicates]
      additionalProperties: false
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Events stored by this request.
        duplicates:
          type: integer
          minimum: 0
          description: Events whose `event_id` the server already had (ignored, not an error).

    # ---------- envelope ----------
    EventEnvelope:
      description: |
        Fields common to every event. Each event type combines this with its own `type` constant
        and `data` schema. Unknown fields are rejected.
      type: object
      required: [event_id, type, occurred_at, username, source, data]
      properties:
        event_id:
          type: string
          format: uuid
          description: Generated by the client, once per event. The idempotency key.
        type:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9_]*){2,}$'
          description: '`<domain>.<entity>.<verb>`. See the event schemas for the known types.'
        occurred_at:
          type: string
          format: date-time
          description: When it happened, by the client's clock (RFC 3339). The server records its own receive time separately.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Login name of the person using the tool (e.g. `$USER`).
        source:
          $ref: '#/components/schemas/Source'
        data:
          type: object

    Source:
      type: object
      description: The client that emitted the event.
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          examples: [localdev-client]
        version:
          type: string
          minLength: 1
          maxLength: 64
          description: Client version or git commit.
          examples: [de78fa6, 1.2.0]

    # ---------- shared fields ----------
    ClusterId:
      type: string
      format: uuid
      description: Identifies one localdev cluster, from creation to destruction. Generated at `cluster:create`.

    Version:
      type: string
      pattern: '^v?\d+\.\d+(\.\d+)?([-+][0-9A-Za-z.+-]+)?$'
      maxLength: 64

    # ---------- localdev ----------
    LocaldevClusterCreated:
      title: localdev.cluster.created
      description: A localdev cluster was created.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: localdev.cluster.created
            data:
              type: object
              required: [cluster_id, profile, components, platform, platform_version, kubernetes_version, os, os_version, arch]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                profile:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                  description: Profile the cluster was created with.
                  examples: [dev, full]
                components:
                  type: array
                  description: Components enabled by the profile.
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
                platform:
                  type: string
                  enum: [k3d]
                  description: Kubernetes distribution or tool that runs the cluster.
                platform_version:
                  $ref: '#/components/schemas/Version'
                kubernetes_version:
                  $ref: '#/components/schemas/Version'
                os:
                  type: string
                  enum: [linux, macos, windows]
                  description: The user's operating system. WSL counts as `windows`.
                os_variant:
                  type: string
                  maxLength: 64
                  description: Refinement of `os`, such as `wsl2`, a Linux distribution id, or the macOS Docker runtime (`rancher-desktop`).
                  examples: [wsl2, ubuntu, fedora, rancher-desktop]
                os_version:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Release of the OS (for `wsl2`, the Linux distribution inside it).
                  examples: ['24.04', '15.6.1', 'Ubuntu 24.04']
                arch:
                  type: string
                  enum: [amd64, arm64]
      unevaluatedProperties: false

    LocaldevClusterDestroyed:
      title: localdev.cluster.destroyed
      description: A localdev cluster was destroyed.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: localdev.cluster.destroyed
            data:
              type: object
              required: [cluster_id]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
      unevaluatedProperties: false

    LocaldevClusterEvent:
      title: localdev.cluster.event
      description: |
        An ad-hoc event attached to a cluster: an app deployed, a test suite run, a profile
        change. `name` says what happened, and `attributes` carries free-form details.
        `outcome` and `duration_ms` are first-class, so the common cases can be aggregated
        without reading `attributes`.
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              const: localdev.cluster.event
            data:
              type: object
              required: [cluster_id, name]
              additionalProperties: false
              properties:
                cluster_id:
                  $ref: '#/components/schemas/ClusterId'
                name:
                  type: string
                  pattern: '^[a-z0-9]+(\.[a-z0-9_-]+)*$'
                  maxLength: 128
                  description: Dotted, lower-case event name.
                  examples: [app.deployed, tests.run, profile.changed]
                outcome:
                  type: string
                  enum: [success, failure, cancelled]
                duration_ms:
                  type: integer
                  minimum: 0
                attributes:
                  type: object
                  description: Free-form details. Flat key-value pairs. Values are strings, numbers or booleans.
                  maxProperties: 50
                  propertyNames:
                    pattern: '^[a-z0-9_.-]{1,64}$'
                  additionalProperties:
                    type: [string, number, boolean]
                    maxLength: 1024
      unevaluatedProperties: false

    # ---------- operations ----------
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [malformed_request, too_large, validation_failed, unavailable]
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the event in `events`. Absent for problems with the batch itself.
        path:
          type: string
          description: Dotted path of the offending field within the event.
          examples: [data.os]
        message:
          type: string
