# kube/localdev — ephemeral local kubernetes (k3d)
#   cluster:  mise run cluster:create [profile] | cluster:profile [profile] | cluster:status | cluster:destroy | cluster:recreate | cluster:secrets | cluster:clean
#   apps/tools: mise run build <app> | pg:forward | pg:psql | kn:forward | keycloak:apply | keycloak:export
#   mise run grafana:list | grafana:export | grafana:import | grafana:fetch   (see grafana/dashtool.py)
#   see readme.md

[tools]
k3d = '5.9.0'
kubectl = '1.37.1'   # overrides root 1.27
helm = '4.3.0'
k9s = '0.51.0'
kn = 'knative-v1.23.0'   # Knative CLI (kn service create/list, kn broker, kn trigger)

[env]
CLUSTER_NAME = "localdev"
KUBECONFIG = "{{config_root}}/.kubeconfig"   # never touch ~/.kube/config
LOCALDEV_ROOT = "{{config_root}}"            # expanded in k3d.yaml (absolute host paths)

[tasks."cluster:create"]
description = "Create the localdev k3d cluster with a profile (default: last used, else profiles.toml default)"
usage = 'arg "[profile]" help="lite | dev | knative | full (see profiles.toml)"'
run = """#!/bin/bash
set -euo pipefail

mise run cluster:secrets:check

# the active view k3s and Grafana read: runtime.profile/ (links into manifests/, components/)
python3 profile.py link ${usage_profile:-}

# persistent host data (see k3d.yaml); create as us, not as root via docker
mkdir -p runtime.data/registry

k3d cluster create --config k3d.yaml \
    --volume "{{config_root}}/runtime.profile/manifests:/var/lib/rancher/k3s/server/manifests/localdev@server:0"

k3d kubeconfig get "$CLUSTER_NAME" > "$KUBECONFIG"
chmod 600 "$KUBECONFIG"

mise run cluster:secrets
mise run cluster:profile:sync

echo "Waiting for traefik..."
until kubectl -n kube-system get deploy traefik >/dev/null 2>&1; do sleep 2; done
kubectl -n kube-system rollout status deploy/traefik --timeout=180s

for app in apps/*/; do mise run build "$(basename "$app")"; done

if python3 profile.py enabled keycloak; then mise run keycloak:apply; fi
echo "cluster ready - profile $(python3 profile.py current): $(tr '\n' ' ' < runtime.profile/components)"
"""

[tasks."cluster:secrets:check"]
description = "Decrypt secrets.env.asc if it's newer than secrets.env, and check all keys are set"
hide = true
run = """#!/bin/bash
set -euo pipefail
if [ ! -s secrets.env ] || [ secrets.env.asc -nt secrets.env ]; then
    mise run decrypt "{{config_root}}/secrets.env.asc"
fi
set -a; source secrets.env; set +a
for v in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET COOKIE_SECRET LOCAL_ADMIN_PASSWORD; do
    [ -n "${!v:-}" ] || { echo "ERROR: $v missing from secrets.env (see readme.md)" >&2; exit 1; }
done
"""

[tasks."cluster:secrets"]
description = "Load secrets.env into the cluster: oauth2-proxy (Google), local admin login, Grafana admin"
run = """#!/bin/bash
set -euo pipefail
mise run cluster:secrets:check
set -a; source secrets.env; set +a
apply() { kubectl apply -f - >/dev/null && echo "  $1"; }
for ns in auth monitoring; do
    kubectl create namespace $ns --dry-run=client -o yaml | kubectl apply -f - >/dev/null
done
kubectl -n auth create secret generic oauth2-proxy \
    --from-literal=client-id="$GOOGLE_CLIENT_ID" \
    --from-literal=client-secret="$GOOGLE_CLIENT_SECRET" \
    --from-literal=cookie-secret="$COOKIE_SECRET" \
    --dry-run=client -o yaml | apply "auth/oauth2-proxy (Google client, cookie secret)"
# local login for oauth2-proxy's sign-in form: user admin, bcrypt via htpasswd (password on stdin)
htline=$(printf '%s' "$LOCAL_ADMIN_PASSWORD" | docker run --rm -i httpd:2.4-alpine htpasswd -niB admin)
kubectl -n auth create secret generic oauth2-proxy-htpasswd --from-literal=users.txt="$htline" \
    --dry-run=client -o yaml | apply "auth/oauth2-proxy-htpasswd (local user admin)"
# Grafana's built-in admin = the same admin (Grafana login form, for non-Google sessions)
kubectl -n monitoring create secret generic grafana-admin \
    --from-literal=admin-user=admin --from-literal=admin-password="$LOCAL_ADMIN_PASSWORD" \
    --dry-run=client -o yaml | apply "monitoring/grafana-admin"
# Keycloak's bootstrap admin (master realm) = the same admin (only when keycloak is in the profile)
if python3 profile.py enabled keycloak; then
kubectl create namespace keycloak --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n keycloak create secret generic keycloak-admin \
    --from-literal=username=admin --from-literal=password="$LOCAL_ADMIN_PASSWORD" \
    --dry-run=client -o yaml | apply "keycloak/keycloak-admin"
fi
# pods read these at startup: restart the ones that already exist (no-op on a fresh cluster)
kubectl -n auth rollout restart deploy/oauth2-proxy >/dev/null 2>&1 && echo "  restarted oauth2-proxy" || true
"""

[tasks.build]
description = "Build apps/<app>, push to the local registry, restart its deployment"
usage = 'arg "<app>" help="directory under apps/"'
run = """#!/bin/bash
set -euo pipefail
app="$usage_app"
image="localhost:5005/$app:latest"       # pulled in-cluster as localdev-registry:5005/$app

docker build -t "$image" "apps/$app"
docker push "$image"

# restart any deployment labelled app=<app> so it pulls the new :latest
kubectl get deploy -A -l app="$app" -o jsonpath='{range .items[*]}{.metadata.namespace}{"\\n"}{end}' |
while read -r ns; do
    kubectl -n "$ns" rollout restart deploy -l app="$app"
    kubectl -n "$ns" rollout status deploy -l app="$app" --timeout=120s
done
"""

[tasks."cluster:destroy"]
description = "Delete the localdev cluster and its kubeconfig"
run = """#!/bin/bash
k3d cluster delete "$CLUSTER_NAME"
rm -f "$KUBECONFIG"
"""

[tasks."cluster:recreate"]
description = "Destroy then create"
usage = 'arg "[profile]"'
run = ["mise run cluster:destroy", "mise run cluster:create ${usage_profile:-}"]

[tasks."cluster:status"]
description = "Show profile, cluster, nodes, helm install jobs and ingresses"
run = """#!/bin/bash
echo "profile: $(python3 profile.py current)  components: $(tr '\n' ' ' < runtime.profile/components 2>/dev/null)"
k3d cluster list
kubectl get nodes -o wide
kubectl get helmcharts -A
kubectl get jobs -A -l helmcharts.helm.cattle.io/chart
kubectl get ingress,ingressroutes -A 2>/dev/null
"""

[tasks."cluster:clean"]
description = "Delete runtime.data (postgres data, registry images). Cluster must be destroyed first."
usage = 'flag "-y --yes" help="skip the confirmation prompt"'
raw = true   # interactive prompt
run = """#!/bin/bash
set -euo pipefail
if k3d cluster get "$CLUSTER_NAME" >/dev/null 2>&1; then
    echo "Cluster '$CLUSTER_NAME' is running and using runtime.data. Run 'mise run cluster:destroy' first." >&2
    exit 1
fi
if [ ! -d runtime.data ]; then
    echo "Nothing to clean: runtime.data does not exist."
    exit 0
fi
echo "This permanently deletes $PWD/runtime.data:"
# sizes via docker: postgres files are uid 999 and unreadable to us
docker run --rm -v "$PWD/runtime.data:/data:ro" alpine:3.22 sh -c 'cd /data && du -sh * 2>/dev/null' | sed 's/^/    /' || true
if [ "${usage_yes:-false}" != "true" ]; then
    read -r -p "Type 'clean' to confirm: " answer
    [ "$answer" = "clean" ] || { echo "Aborted."; exit 1; }
fi
# contents are owned by container users (root, postgres uid 999): delete via docker, not sudo
docker run --rm -v "$PWD/runtime.data:/data" alpine:3.22 sh -c 'rm -rf /data/* /data/.[!.]* 2>/dev/null; true'
rmdir runtime.data
echo "runtime.data deleted."
"""

[tasks."pg:forward"]
description = "Port-forward postgres to localhost (default 5432)"
usage = 'arg "[port]" default="5432"'
raw = true
run = """#!/bin/bash
echo "postgresql://app:localdev@localhost:${usage_port}/app   (Ctrl-C to stop)"
kubectl -n pg port-forward svc/postgres-rw "${usage_port}:5432"
"""

[tasks."pg:psql"]
description = "psql shell in the postgres pod (as app, db app)"
raw = true
run = "kubectl -n pg exec -it statefulset/postgres -- psql -U app app"

# --- grafana dashboards (grafana/dashboards/<folder>/*.json, provisioned live) ---------
# list/export talk to Grafana through a temporary port-forward; import/fetch only write files.

[tasks."grafana:list"]
description = "List dashboards in Grafana (folder, uid, title)"
run = """#!/bin/bash
set -euo pipefail
kubectl -n monitoring port-forward svc/grafana 13000:80 >/dev/null 2>&1 & pf=$!
trap 'kill $pf' EXIT
until curl -sf -o /dev/null http://localhost:13000/grafana/api/health; do sleep 0.3; done
python3 grafana/dashtool.py list
"""

[tasks."grafana:export"]
description = "Save a Grafana dashboard to grafana/dashboards/<folder>/ (default: its Grafana folder, else apps)"
usage = '''
arg "<dashboard>" help="uid or title search"
arg "[folder]" help="platform | infra | apps | root | component:<name> | <new folder> (default: where its file already is)"
'''
run = """#!/bin/bash
set -euo pipefail
kubectl -n monitoring port-forward svc/grafana 13000:80 >/dev/null 2>&1 & pf=$!
trap 'kill $pf' EXIT
until curl -sf -o /dev/null http://localhost:13000/grafana/api/health; do sleep 0.3; done
python3 grafana/dashtool.py export "$usage_dashboard" ${usage_folder:-}
python3 profile.py link >/dev/null   # new files must be linked into runtime.profile/ to appear
"""

[tasks."grafana:import"]
description = "Copy dashboard JSON file(s) into grafana/dashboards/<folder>/ (normalized; Grafana loads them live)"
usage = '''
arg "<path>" help="a .json file or a directory of them"
arg "[folder]" default="apps"
'''
dir = "{{cwd}}"   # resolve <path> from where you ran mise
run = 'python3 "{{config_root}}/grafana/dashtool.py" import "$usage_path" "$usage_folder" && python3 "{{config_root}}/profile.py" link >/dev/null'

[tasks."grafana:fetch"]
description = "Download a grafana.com dashboard into grafana/dashboards/<folder>/"
usage = '''
arg "<id>" help="grafana.com dashboard id"
arg "<folder>"
'''
run = 'python3 grafana/dashtool.py fetch "$usage_id" "$usage_folder" && python3 profile.py link >/dev/null'

# --- knative (internal-only: services are reachable in-cluster at <svc>.<ns>.svc.cluster.local) ---

[tasks."kn:forward"]
description = "Port-forward Knative's internal gateway to localhost:8081; call services with a Host header"
usage = 'arg "[port]" default="8081"'
raw = true
run = """#!/bin/bash
echo "Knative internal gateway on localhost:${usage_port}. Call a service with its cluster-local host, e.g.:"
echo "  curl -H 'Host: hello.demo.svc.cluster.local' http://localhost:${usage_port}/"
echo "Services: $(kubectl get ksvc -A -o jsonpath='{range .items[*]}{.metadata.name}.{.metadata.namespace} {end}')"
kubectl -n knative-serving port-forward svc/kourier-internal "${usage_port}:80"
"""

[tasks."grafana:check"]
description = "Validate grafana/dashboards: JSON parses, uids unique (a duplicate freezes provisioning)"
run = "python3 grafana/dashtool.py check"

# --- keycloak (IdP for apps; realms as code in keycloak/realms/*.json) -------------------

[tasks."keycloak:apply"]
description = "Apply keycloak/realms/*.json to Keycloak (keycloak-config-cli Job; idempotent)"
run = """#!/bin/bash
set -euo pipefail
kubectl create namespace keycloak --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n keycloak create configmap keycloak-realms --from-file=keycloak/realms/ \
    --dry-run=client -o yaml | kubectl apply -f - >/dev/null
echo "Waiting for Keycloak..."
# after a profile switch k3s may not have created it yet (and it waits for postgres)
for i in $(seq 150); do kubectl -n keycloak get deploy keycloak >/dev/null 2>&1 && break; sleep 2; done
kubectl -n keycloak rollout status deploy/keycloak --timeout=400s
kubectl -n keycloak delete job keycloak-config --ignore-not-found >/dev/null
kubectl apply -f - >/dev/null <<'EOF'
apiVersion: batch/v1
kind: Job
metadata: {name: keycloak-config, namespace: keycloak}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          image: adorsys/keycloak-config-cli:6.5.1-26.5.5
          env:
            - {name: KEYCLOAK_URL, value: "http://keycloak.keycloak.svc:8080/keycloak"}
            - name: KEYCLOAK_USER
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
            - name: KEYCLOAK_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
            - {name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true"}
            - {name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: "120s"}
            - {name: IMPORT_FILES_LOCATIONS, value: "/config/*.json"}
          volumeMounts: [{name: realms, mountPath: /config}]
      volumes: [{name: realms, configMap: {name: keycloak-realms}}]
EOF
if kubectl -n keycloak wait --for=condition=complete job/keycloak-config --timeout=300s >/dev/null; then
    kubectl -n keycloak logs job/keycloak-config | grep -E "Importing file|realm|Done|ERROR" | sed 's/^/  /' | tail -15
    echo "keycloak:apply done"
else
    kubectl -n keycloak logs job/keycloak-config | tail -30
    echo "keycloak:apply FAILED" >&2; exit 1
fi
"""

[tasks."keycloak:export"]
description = "Save a realm configured in the Keycloak UI back to keycloak/realms/<realm>.json"
usage = 'arg "[realm]" default="localdev"'
run = """#!/bin/bash
set -euo pipefail
set -a; source secrets.env; set +a
kubectl -n keycloak port-forward svc/keycloak 18180:8080 >/dev/null 2>&1 & pf=$!
trap 'kill $pf' EXIT
until curl -sf -o /dev/null http://localhost:18180/keycloak/realms/master; do sleep 0.5; done
KEYCLOAK_URL=http://localhost:18180/keycloak python3 keycloak/realmtool.py export "$usage_realm"
"""

# --- profiles (profiles.toml + profile.py; active view in runtime.profile/) ------------------

[tasks."cluster:profile"]
description = "List profiles, or switch the running cluster to one (adds/removes tools live)"
usage = 'arg "[profile]"'
run = """#!/bin/bash
set -euo pipefail
if [ -z "${usage_profile:-}" ]; then python3 profile.py list; exit 0; fi
to="$usage_profile"
echo "profile: $(python3 profile.py current) -> $to"
python3 profile.py link "$to"          # additions deploy by themselves (k3s + Grafana follow the links)
# uninstall components that are deployed (AddOn exists) but not in the new profile. k3s never
# deletes objects when their files disappear. Re-running finishes a partial switch.
addons=$(kubectl -n kube-system get addon -o jsonpath='{.items[*].metadata.name}')
removed=$(python3 profile.py removed "$to" $addons)
failed=0
while IFS=$'\t' read -r comp file; do
    [ -n "$comp" ] || continue
    echo "  - $comp: $(basename "$file")"
    # resources first (operators finalize their CRs while the namespace still exists) ...
    yq 'select(.kind != "Namespace")' "$file" | kubectl delete -f - --ignore-not-found --wait --timeout=600s 2>&1 \
        | sed 's/^/      /' || failed=1
    # ... then the namespaces the file owns
    for ns in $(yq 'select(.kind == "Namespace") | .metadata.name' "$file" | grep -v '^---'); do
        kubectl delete namespace "$ns" --ignore-not-found --wait --timeout=600s 2>&1 | sed 's/^/      /' || failed=1
    done
    kubectl -n kube-system delete addon "$(basename "$file" | sed -E 's/\\.ya?ml$//')" --ignore-not-found >/dev/null
done <<< "$removed"
# k3s skips a file whose path+mtime it has seen before - even if we deleted its objects since -
# so give re-added components' manifests a fresh mtime (content and git are unaffected)
missing=$(python3 profile.py missing $(kubectl -n kube-system get addon -o jsonpath='{.items[*].metadata.name}'))
if [ -n "$missing" ]; then touch $missing; fi
mise run cluster:profile:sync
if python3 profile.py enabled keycloak; then mise run cluster:secrets >/dev/null; mise run keycloak:apply; fi
echo "profile $to active: $(tr '\n' ' ' < runtime.profile/components)"
if [ "$failed" = 1 ]; then echo "some deletions timed out - re-run 'mise run cluster:profile $to' to finish" >&2; exit 1; fi
"""

[tasks."cluster:profile:sync"]
description = "Publish the enabled components to cnav (ConfigMap localdev-profile)"
hide = true
run = """#!/bin/bash
set -euo pipefail
kubectl create namespace cnav --dry-run=client -o yaml | kubectl apply -f - >/dev/null
kubectl -n cnav create configmap localdev-profile --from-file=components=runtime.profile/components \
    --from-literal=profile="$(python3 profile.py current)" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
"""
