# Serves the site under /docs/ (same path as the Ingress), so Traefik needs no strip/redirect middlewares.
server {
    listen 8080;
    root /usr/share/nginx/html;
    absolute_redirect off;            # /docs -> /docs/ as a relative Location (keeps host/port of the client)

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { return 302 /docs/; }

    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
        location ~* \.html$ { add_header Cache-Control "no-cache"; }   # pages revalidate after a rebuild
    }
}
