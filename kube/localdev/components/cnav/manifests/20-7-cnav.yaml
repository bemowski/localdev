# Cluster navigator at / — cards linking to the apps, plus a live status column. Behind SSO.
# Image: components/cnav/docker (Python), built and pushed by `mise run build cnav`.
# Edit cards.yaml / status.yaml below; the page picks them up within ~a minute, no rebuild.
apiVersion: v1
kind: Namespace
metadata:
  name: cnav
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnav-config
  namespace: cnav
data:
  cards.yaml: |
    - component: Headlamp
      icon: 🔦
      link: /headlamp/
      description: Kubernetes dashboard
      links:
        - {label: docs, url: /docs/, tool: docs}   # localdev docs; hidden when the docs component isn't installed
    - component: Grafana
      icon: 📊
      link: /grafana/
      description: Dashboards, metrics and logs
      links:
        # deep link: the Logs dashboard (grafana/dashboards/logs.json), every namespace and service, last hour
        - {label: logs, url: "/grafana/d/localdev-logs/logs?from=now-1h&to=now&var-namespace=$__all&var-service=$__all"}
    - component: Prometheus
      icon: 🔥
      link: /prometheus/
      description: Metrics and scrape targets
    - component: Registry
      icon: 📦
      link: /registry/
      description: Images in the localdev registry
    - component: pgweb
      tool: postgres
      icon: 🐘
      link: /pgweb/
      description: Postgres (postgres/postgres-rw), app database
    - component: NATS
      tool: nats
      icon: 📨
      link: /nats/
      description: "NUI: subjects, JetStream streams, KV"
      links:
        - {label: docs, url: https://docs.nats.io/concepts/pub-sub-basics}
    - component: Keycloak
      tool: keycloak
      icon: 🔐
      link: /keycloak/admin/
      description: Identity provider for apps (realm localdev)
    - component: whoami
      icon: 👋
      link: /whoami
      description: SSO test app, echoes request headers
  # Groups -> items -> checks; an item's light is the worst of its checks.
  # kinds: Deployment | StatefulSet | DaemonSet (namespace, name) | HelmChart (name)
  # optional per item: namespace (display override for the prefix), link,
  #   tool: <component> (shown only when that component is in the cluster's profile)
  status.yaml: |
    - group: platform
      items:
        - name: Traefik
          checks:
            - {kind: Deployment, namespace: kube-system, name: traefik}
            - {kind: HelmChart, name: traefik}
        - name: oauth2-proxy
          checks:
            - {kind: Deployment, namespace: auth, name: oauth2-proxy}
            - {kind: HelmChart, name: oauth2-proxy}
        - name: CoreDNS
          checks:
            - {kind: Deployment, namespace: kube-system, name: coredns}
    - group: infra
      items:
        - name: Headlamp
          checks:
            - {kind: Deployment, namespace: headlamp, name: headlamp}
            - {kind: HelmChart, name: headlamp}
        - name: Prometheus
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: prometheus-kps-prometheus}
            - {kind: Deployment, namespace: monitoring, name: kps-operator}
            - {kind: HelmChart, name: kube-prometheus-stack}
        - name: Grafana
          checks:
            - {kind: Deployment, namespace: monitoring, name: grafana}
        - name: Alertmanager
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: alertmanager-kps-alertmanager}
        - name: Exporters
          checks:
            - {kind: DaemonSet, namespace: monitoring, name: kube-prometheus-stack-prometheus-node-exporter}
            - {kind: Deployment, namespace: monitoring, name: kube-prometheus-stack-kube-state-metrics}
        - name: Loki
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: loki}
            - {kind: HelmChart, name: loki}
        - name: Alloy (logs + OTLP)
          checks:
            - {kind: Deployment, namespace: monitoring, name: alloy}
            - {kind: HelmChart, name: alloy}
        - name: Tempo
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: tempo}
            - {kind: HelmChart, name: tempo}
        - name: Registry UI
          checks:
            - {kind: Deployment, namespace: registry, name: registry-ui}
        - name: cnav
          checks:
            - {kind: Deployment, namespace: cnav, name: cnav}
        - name: External Secrets
          checks:
            - {kind: Deployment, namespace: external-secrets, name: external-secrets}
            - {kind: Deployment, namespace: external-secrets, name: external-secrets-webhook}
            - {kind: Deployment, namespace: external-secrets, name: external-secrets-cert-controller}
            - {kind: HelmChart, name: external-secrets}
        - name: Reloader
          checks:
            - {kind: Deployment, namespace: reloader, name: reloader-reloader}
            - {kind: HelmChart, name: reloader}
    - group: tools
      items:
        - name: Postgres
          tool: postgres
          checks:
            - {kind: StatefulSet, namespace: postgres, name: postgres}
        - name: pgweb
          tool: postgres
          checks:
            - {kind: Deployment, namespace: postgres, name: pgweb}
        - name: NATS
          tool: nats
          checks:
            - {kind: StatefulSet, namespace: nats, name: nats}
            - {kind: HelmChart, name: nats}
        - name: NUI
          tool: nats
          checks:
            - {kind: Deployment, namespace: nats, name: nui}
        - name: nats-box
          tool: nats
          checks:
            - {kind: Deployment, namespace: nats, name: nats-box}
        - name: Docs
          tool: docs
          checks:
            - {kind: Deployment, namespace: docs, name: docs}
        - name: Keycloak
          tool: keycloak
          checks:
            - {kind: Deployment, namespace: keycloak, name: keycloak}
        - name: Knative operator
          tool: knative
          namespace: kn-operator     # display only; real ns knative-operator
          checks:
            - {kind: Deployment, namespace: knative-operator, name: knative-operator}
            - {kind: Deployment, namespace: knative-operator, name: operator-webhook}
            - {kind: HelmChart, name: knative-operator}
        - name: Knative Serving
          tool: knative
          namespace: kn-serving     # display only; real ns knative-serving
          checks:
            - {kind: Deployment, namespace: knative-serving, name: activator}
            - {kind: Deployment, namespace: knative-serving, name: autoscaler}
            - {kind: Deployment, namespace: knative-serving, name: controller}
            - {kind: Deployment, namespace: knative-serving, name: webhook}
            - {kind: Deployment, namespace: knative-serving, name: net-kourier-controller}
            - {kind: Deployment, namespace: knative-serving, name: 3scale-kourier-gateway}
        - name: Knative Eventing
          tool: knative
          namespace: kn-eventing     # display only; real ns knative-eventing
          checks:
            - {kind: Deployment, namespace: knative-eventing, name: eventing-controller}
            - {kind: Deployment, namespace: knative-eventing, name: eventing-webhook}
            - {kind: Deployment, namespace: knative-eventing, name: imc-controller}
            - {kind: Deployment, namespace: knative-eventing, name: imc-dispatcher}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-controller}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-filter}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-ingress}
    - group: apps
      items:
        - name: whoami
          checks:
            - {kind: Deployment, namespace: demo, name: whoami}
  # Logins for things NOT behind SSO, shown (masked) in the Ports card's Credentials tab.
  # entry: a secret store entry (secret-store/<entry>, from secrets.store.toml / secrets.defaults.toml);
  #   static: fixed values instead. extras: str.format templates over the entry's keys.
  #   tool: <component> hides the row when the component isn't installed.
  # Any other store entry with a `password` key is listed too (secret-store/<entry>), so components
  # that bring their own logins (e.g. usage-db) show up without an edit here; so are API keys
  # (entries api-<name> with an api-key* key, components/api-auth).
  credentials.yaml: |
    - name: Local admin
      entry: localdev-admin
      where: http://localhost/
      note: SSO sign-in with username and password (instead of Google)
    - name: Grafana admin
      entry: localdev-admin
      where: /grafana/login
      note: Grafana's own login form (SSO users are signed in automatically)
    - name: Keycloak admin console
      tool: keycloak
      entry: localdev-admin
      where: /keycloak/admin/
      note: realm master
    - name: Keycloak test users
      tool: keycloak
      where: /keycloak/realms/localdev/account/
      note: realm localdev (components/keycloak/realms/localdev.json); bob has the same password
      static: {username: alice, password: password}
    - name: Postgres
      tool: postgres
      entry: postgres-app
      where: localhost:5432
      note: superuser of the app database; also pgweb's login
      extras:
        uri: postgresql://{username}:{password}@localhost:5432/{dbname}
        jdbc: jdbc:postgresql://localhost:5432/{dbname}?user={username}&password={password}
    - name: Postgres, keycloak database
      tool: keycloak
      entry: keycloak-db
      where: localhost:5432
      note: database keycloak
      extras:
        uri: postgresql://{username}:{password}@localhost:5432/keycloak
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnav
  namespace: cnav
---
# read-only: just what /cnav/api/status, /cnav/api/ports and /cnav/api/events look at
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnav-status
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get]
  - apiGroups: ["helm.cattle.io"]
    resources: [helmcharts]
    verbs: [get]
  - apiGroups: ["metrics.k8s.io"]     # memory rollups (metrics-server)
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [""]                   # node allocatable memory (header tooltip)
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]                   # /cnav/api/ports: which Service answers a host port
    resources: [services]
    verbs: [list]
  - apiGroups: ["discovery.k8s.io"]   # ... and its ready endpoints
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [""]                   # /cnav/api/events fallback while Loki isn't answering
    resources: [events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnav-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnav-status
subjects:
  - kind: ServiceAccount
    name: cnav
    namespace: cnav
---
# /cnav/api/credentials: the secret store's own Secrets (namespace secret-store), nothing else. Anyone
# signed in through SSO can read them on the page: intended for a local cluster, SSO is the gate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnav-credentials
  namespace: secret-store
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnav-credentials
  namespace: secret-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnav-credentials
subjects:
  - kind: ServiceAccount
    name: cnav
    namespace: cnav
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnav
  namespace: cnav
  labels: {app: cnav}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnav}
  template:
    metadata:
      labels: {app: cnav}
    spec:
      serviceAccountName: cnav
      enableServiceLinks: false   # no CNAV_PORT=tcp://... style env vars
      containers:
        - name: cnav
          image: localdev-registry:5005/cnav:latest
          imagePullPolicy: Always
          env:
            - {name: CNAV_LOG_LEVEL, value: INFO}   # DEBUG adds the page's polling, probes, metrics misses
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            # the server listens ~0.3s after start; probing at once fails (a Warning event per rollout)
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/cnav   # whole dir (not subPath) so ConfigMap edits propagate
            - name: profile
              mountPath: /etc/localdev-profile
            - name: k3d-config     # host port mappings, for /cnav/api/ports
              mountPath: /etc/localdev/k3d.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cnav-config
        - name: profile        # enabled components (cluster:create / cluster:profile); optional
          configMap: {name: localdev-profile, optional: true}
        - name: k3d-config     # the repo is mounted in the node at /localdev (k3d.yaml volumes)
          hostPath: {path: /localdev/k3d.yaml, type: File}
---
apiVersion: v1
kind: Service
metadata:
  name: cnav
  namespace: cnav
spec:
  selector: {app: cnav}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: cnav
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/   # signed in: 202 + identity headers; signed out: sign-in page (allow-list: [sso-access] in the secret store)
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnav
  namespace: cnav
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: cnav-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /          # catch-all; longer app paths still win
            pathType: Prefix
            backend:
              service:
                name: cnav
                port:
                  number: 80
---
# The only cnav page outside SSO: where /oauth2/sign_out?rd=/signed-out lands.
# Exact match, so nothing else on cnav becomes public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnav-public
  namespace: cnav
spec:
  rules:
    - http:
        paths:
          - path: /signed-out
            pathType: Exact
            backend:
              service:
                name: cnav
                port:
                  number: 80
