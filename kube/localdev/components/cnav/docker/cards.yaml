# Cluster navigator cards. Fields: component, icon (emoji), link, description (optional),
#   links (optional): [{label, url, tool}] shown as pills on the card, opening in a new tab;
#   url is absolute or a path on this host (/docs/); tool hides the pill when that component is off
- component: Headlamp
  icon: 🔦
  link: /headlamp/
  description: Kubernetes dashboard
- component: Grafana
  icon: 📊
  link: /grafana/
  description: Dashboards, metrics and logs
- component: Prometheus
  icon: 🔥
  link: /prometheus/
  description: Metrics and scrape targets
- component: Registry
  icon: 📦
  link: /registry/
  description: Images in the localdev registry
- component: pgweb
  icon: 🐘
  link: /pgweb/
  description: Postgres (pg/postgres-rw), app database
- component: NATS
  icon: 📨
  link: /nats/
  description: "NUI: subjects, JetStream streams, KV"
  links:
    - {label: docs, url: https://docs.nats.io/concepts/pub-sub-basics}
- component: Keycloak
  icon: 🔐
  link: /keycloak/admin/
  description: Identity provider for apps (realm localdev)
- component: whoami
  icon: 👋
  link: /whoami
  description: SSO test app, echoes request headers
