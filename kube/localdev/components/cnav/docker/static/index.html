<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Navigator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --panel: #eef0f4;
    --text: #1d2330;
    --muted: #667085;
    --border: #e3e6eb;
    --accent: #3b6fd8;
    --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 4px 12px rgb(16 24 40 / 6%);
    --green: #12a150;
    --amber: #e09b0b;
    --red: #d92d20;
    --red-text: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --card: #181c24;
      --panel: #141820;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --border: #272c36;
      --accent: #7aa2f7;
      --shadow: 0 1px 2px rgb(0 0 0 / 40%);
      --green: #3ccf7a;
      --amber: #f5b638;
      --red: #f0645a;
      --red-text: #f58a82;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* beats display: flex etc. on toggled elements */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  main { flex: 1; min-width: 0; padding: 40px 32px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; max-width: 1040px; }
  .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .user b { color: var(--text); font-weight: 600; }
  .logout {
    font: inherit; font-size: 13px; color: var(--text); text-decoration: none;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--card);
  }
  .logout:hover, .logout:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  h1 { font-size: 24px; margin: 0; }
  .cluster { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    max-width: 1040px;
  }
  .card-wrap { position: relative; display: flex; }
  a.card {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 22px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.flyout {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 7px; color: var(--muted); opacity: .55;
    transition: opacity .12s ease, background .12s ease, color .12s ease;
  }
  .card-wrap:hover a.flyout { opacity: 1; }
  a.flyout:hover, a.flyout:focus-visible { opacity: 1; color: var(--accent); background: var(--panel); outline: none; }
  a.flyout svg { width: 16px; height: 16px; }
  /* per-card extra links ("links:" in cards.yaml): pills on the card's bottom row, new tab */
  .pills {
    position: absolute; right: 18px; bottom: 18px; max-width: 60%;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px;
  }
  a.pill {
    font-size: 12px; line-height: 1; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted); text-decoration: none;
  }
  a.pill:hover, a.pill:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .name { font-size: 17px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; }
  .link { color: var(--accent); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: auto; padding-top: 8px; }
  .error {
    padding: 16px; border: 1px solid var(--red); border-radius: 8px; color: var(--red-text);
    white-space: pre-wrap; font: 13px ui-monospace, monospace;
  }

  /* status column */
  aside {
    width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 40px 20px 24px;
  }
  .status-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  aside h2 { font-size: 16px; margin: 0; }
  .total { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .total-label { color: var(--muted); font: 12px system-ui, sans-serif; margin-right: 4px; }
  .total-sep { color: var(--muted); margin: 0 6px; }
  .updated-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .updated { color: var(--muted); font-size: 12px; }
  .refresh {
    font: 15px/1 system-ui, sans-serif; color: var(--muted); background: none; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px; width: 26px; height: 24px; padding: 0;
  }
  .refresh:hover, .refresh:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  .refresh.spinning { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* time left until the next automatic refresh */
  .countdown { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; margin-bottom: 16px; }
  .countdown-bar { height: 100%; width: 100%; background: var(--accent); opacity: .7; }

  .group {
    margin-bottom: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .group.green { border-left-color: var(--green); }
  .group.amber { border-left-color: var(--amber); }
  .group.red { border-left-color: var(--red); }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; cursor: pointer; user-select: none;
    background: color-mix(in srgb, var(--panel) 60%, var(--card));
    border-bottom: 1px solid var(--border);
  }
  .group-name { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .group-count { color: var(--muted); font-size: 12px; }
  .group-mem { margin-left: auto; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chevron { color: var(--muted); font-size: 11px; width: 10px; transition: transform .15s ease; }
  .group.collapsed .chevron { transform: rotate(-90deg); }
  .group.collapsed .group-head { border-bottom: 0; }
  .group.collapsed .rows { display: none; }
  .group.forced .group-head { cursor: default; }       /* not all green: always open */
  .group.forced .chevron { visibility: hidden; }
  .rows { padding: 4px 4px; }
  a.row, div.row {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    column-gap: 10px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    color: inherit;
    text-decoration: none;
  }
  a.row:hover { background: var(--panel); }
  .row-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-name .ns { color: var(--muted); font-weight: 400; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row-name .ns::after { content: " / "; opacity: .6; }
  .count { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .reason { grid-column: 2 / 4; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .reason.red { color: var(--red-text); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.green { background: var(--green); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

  /* row under the cards: ports (left) | events (right), each about a quarter of the screen high */
  /* under the cards, full width of main: one card, three tabs (events | ports | credentials) */
  .dock {
    display: flex; flex-direction: column; min-width: 0; height: 32vh; min-height: 220px; margin-top: 24px;
    padding: 12px 18px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .dock-body { flex: 1; min-height: 0; overflow-y: auto; }
  .dock h2 { font-size: 16px; margin: 0; }
  .dock-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .dock-sub { color: var(--muted); font-size: 12px; }
  /* Ports | Credentials tabs: a tight segmented control in the card header */
  .tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .tab {
    font: 600 14px system-ui, sans-serif; color: var(--muted); background: none; border: 0; cursor: pointer;
    padding: 2px 10px; border-radius: 6px;
  }
  .tab:hover, .tab:focus-visible { color: var(--text); outline: none; }
  .tab[aria-selected="true"] { color: var(--text); background: var(--panel); }
  .creds { width: 100%; border-collapse: collapse; font-size: 13px; }
  .creds td { padding: 5px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  .creds td:first-child { padding-left: 0; }
  .creds tr:first-child td { border-top: 0; }
  .creds .cname { font-weight: 600; width: 32%; min-width: 180px; }
  .creds .cname a { color: inherit; text-decoration: none; }
  .creds .cname a:hover { color: var(--accent); }
  .creds .csub { display: block; font-weight: 400; color: var(--muted); font-size: 12px; white-space: normal; }
  .creds .csub.mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .creds .kv { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
  .creds .cbtns:empty { display: none; }
  .creds .k { color: var(--muted); font-size: 12px; }
  .creds .v { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .creds .v.masked { color: var(--muted); letter-spacing: 1px; }
  .creds .cbtns { display: flex; gap: 2px; justify-self: end; }
  .creds td.cvals { width: 68%; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 22px; height: 20px; padding: 0; cursor: pointer;
    background: none; border: 1px solid transparent; border-radius: 5px; color: var(--muted);
  }
  .icon-btn:hover, .icon-btn:focus-visible { color: var(--accent); border-color: var(--border); outline: none; }
  .icon-btn.done { color: var(--green); }
  .icon-btn svg { width: 14px; height: 14px; }
  .ports { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ports td { padding: 5px 8px; border-top: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  .ports tr:first-child td { border-top: 0; }
  .ports td.dotcell { width: 12px; padding-right: 0; }
  .ports td.dotcell .dot { display: inline-block; vertical-align: middle; }
  .ports .hostport { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ports .arrow { color: var(--muted); width: 1em; }
  .ports .dest { width: 100%; white-space: normal; }
  .ports .dest a { color: inherit; text-decoration: none; }
  .ports .dest a:hover { color: var(--accent); }
  .ports .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .ports .ns { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ports .ns::after { content: " / "; opacity: .6; }
  .ports .sub { display: block; color: var(--muted); font-size: 12px; }
  .ports .sub.red { color: var(--red-text); }
  .ports tr.none td { color: var(--muted); }
  .dock-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .dock-tools .refresh { width: 24px; height: 20px; font-size: 13px; }
  .dock-toggle {
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;
    padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 12px;
  }
  .dock-toggle input { margin: 0; accent-color: var(--accent); }
  button.dock-toggle { background: none; font: inherit; font-size: 12px; line-height: 18px; }
  button.dock-toggle:hover, button.dock-toggle:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  button.dock-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .dock-toggle:has(input:checked) { border-color: var(--accent); color: var(--accent); }
  .events { width: 100%; border-collapse: collapse; font-size: 13px; }
  .events td { padding: 5px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  .events td:first-child { padding-left: 0; }
  .events td.msgcell { width: 100%; padding-right: 0; }   /* the message takes whatever the others leave */
  .events tr:first-child td { border-top: 0; }
  .events .age { white-space: nowrap; width: 1%; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .events .kind { white-space: nowrap; width: 1%; }
  .events .comp { white-space: nowrap; width: 1%; }
  .events .comp > * {   /* long names are cut (full name in the tooltip) so the message keeps its room */
    display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; vertical-align: top;
  }
  .events .comp a { color: inherit; text-decoration: none; }
  .events .comp a:hover { color: var(--accent); }
  .events .ns { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .events .ns::after { content: " / "; opacity: .6; }
  .events .msg {
    color: var(--muted); line-height: 1.35; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .events .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .etype {
    display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 18px;
    color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent);
  }
  .etype.red { color: var(--red-text); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .etype.amber { color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, transparent); }
  .etype.deploy { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .ecount { margin-left: 4px; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    main { padding: 24px 16px; }
    aside { width: auto; height: auto; position: static; border-left: 0; border-top: 1px solid var(--border); padding: 24px 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <main>
    <header>
      <h1>🧭 Cluster Navigator</h1>
      <span class="cluster" id="cluster"></span>
      <div class="user">
        <span id="whoami"></span>
        <a class="logout" href="/oauth2/sign_out?rd=/signed-out" title="Sign out of localdev SSO">Log out</a>
      </div>
    </header>
    <div class="grid" id="grid"></div>
    <section class="dock">
      <div class="dock-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="events" aria-selected="true" aria-controls="pane-events">Events</button>
          <button class="tab" role="tab" data-tab="ports" aria-selected="false" aria-controls="pane-ports">Ports</button>
          <button class="tab" role="tab" data-tab="creds" aria-selected="false" aria-controls="pane-creds">Credentials</button>
        </div>
        <span class="dock-sub" data-for="events" id="events-sub"></span>
        <span class="dock-sub" data-for="ports" hidden>exposed on this machine (k3d.yaml) → what answers in the cluster</span>
        <span class="dock-sub" data-for="creds" hidden>logins not behind SSO, from the secret store</span>
        <div class="dock-tools" data-for="events">
          <label class="dock-toggle" title="Only problems: crash, image, unhealthy, restart, warning (red and amber)">
            <input type="checkbox" id="events-severe"> severe
          </label>
          <label class="dock-toggle" title="Also show routine pod lifecycle events (scheduled, pulled, started, ...)">
            <input type="checkbox" id="events-all"> all
          </label>
          <button class="refresh" id="events-refresh" title="Refresh events now" aria-label="Refresh events now">↻</button>
        </div>
        <div class="dock-tools" data-for="creds" hidden>
          <button class="dock-toggle" id="creds-unmask" type="button" title="Show every secret value in this list">unmask all</button>
        </div>
      </div>
      <div class="dock-body">
        <div id="pane-events" role="tabpanel">
          <table class="events"><tbody id="events"><tr><td class="mono">loading…</td></tr></tbody></table>
        </div>
        <div id="pane-ports" role="tabpanel" hidden>
          <table class="ports"><tbody id="ports"><tr><td class="mono">loading…</td></tr></tbody></table>
        </div>
        <div id="pane-creds" role="tabpanel" hidden>
          <table class="creds"><tbody id="creds"><tr><td class="mono">loading…</td></tr></tbody></table>
        </div>
      </div>
    </section>
  </main>
  <aside>
    <div class="status-head">
      <h2>Status</h2>
      <span class="total" id="total"></span>
    </div>
    <div class="updated-row">
      <span class="updated" id="updated">loading…</span>
      <button class="refresh" id="refresh" title="Refresh now" aria-label="Refresh status now">↻</button>
    </div>
    <div class="countdown"><div class="countdown-bar" id="countdown"></div></div>
    <div id="status"></div>
  </aside>
</div>
<script src="js-yaml.min.js"></script>
<script>
  const REFRESH_MS = 10000;
  document.getElementById('cluster').textContent = location.host;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // --- cards ---
  const NEW_TAB_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7"/>' +
    '<path d="M13.5 2.5 7 9"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>';

  function renderCards(cards) {
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const c of cards) {
      const wrap = el('div', 'card-wrap');
      const a = el('a', 'card');
      a.href = c.link;
      a.append(el('div', 'icon', c.icon || '🔗'), el('div', 'name', c.component));
      if (c.description) a.append(el('div', 'desc', c.description));
      a.append(el('div', 'link', c.link));
      const fly = el('a', 'flyout');
      fly.href = c.link;
      fly.target = '_blank';
      fly.rel = 'noopener';
      fly.title = fly.ariaLabel = `Open ${c.component} in a new tab`;
      fly.innerHTML = NEW_TAB_SVG;  // static markup, no config data
      wrap.append(a, fly);
      // extra links as pills (siblings of the card link: links can't be nested)
      const links = (c.links || []).filter(l => l && l.label && /^(https?:\/\/|\/)/.test(l.url || ''));   // absolute or a path here
      if (links.length) {
        const pills = el('div', 'pills');
        for (const l of links) {
          const pill = el('a', 'pill', l.label);
          pill.href = l.url;
          pill.target = '_blank';
          pill.rel = 'noopener';
          pill.title = l.url;
          pills.append(pill);
        }
        wrap.append(pills);
      }
      grid.append(wrap);
    }
  }

  // --- signed-in user (oauth2-proxy session) ---
  fetch('/oauth2/userinfo', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(u => {
      const who = document.getElementById('whoami');
      if (!u) { who.textContent = 'not signed in'; return; }
      who.replaceChildren(document.createTextNode('Signed in as '), el('b', null, u.email || u.user));
    })
    .catch(() => {});

  // 401/403 = the SSO session ended while this page was open: reload, which shows the sign-in page
  function checkAuth(r) {
    if (r.status === 401 || r.status === 403) { location.reload(); throw new Error('signed out'); }
    return r;
  }

  fetch('cards.yaml', { cache: 'no-store' })
    .then(checkAuth)
    .then(r => { if (!r.ok) throw new Error(`cards.yaml: HTTP ${r.status}`); return r.text(); })
    .then(text => {
      const cards = jsyaml.load(text);
      if (!Array.isArray(cards)) throw new Error('cards.yaml must be a list of cards');
      renderCards(cards.filter(c => c && c.component && c.link));
    })
    .catch(err => document.getElementById('grid').replaceWith(el('div', 'error', String(err))));

  // --- status ---
  function fmtMem(bytes) {
    if (bytes == null) return '';
    const mi = bytes / 2 ** 20;
    return mi >= 1024 ? `${(mi / 1024).toFixed(2)} GiB` : `${Math.round(mi)} MiB`;
  }

  // collapsed groups, remembered per browser (best effort: storage may be unavailable)
  function loadCollapsed() {
    try { return new Set(JSON.parse(localStorage.getItem('cnav.collapsed') || '[]')); } catch { return new Set(); }
  }
  function saveCollapsed(set) {
    try { localStorage.setItem('cnav.collapsed', JSON.stringify([...set])); } catch {}
  }
  const collapsed = loadCollapsed();

  function renderStatus(data) {
    const box = document.getElementById('status');
    box.replaceChildren();
    const total = document.getElementById('total');
    total.replaceChildren(el('span', 'total-label', 'pods'), document.createTextNode(fmtMem(data.mem)));
    total.title = 'pods: working-set memory of the workloads listed below (sum of the groups)';
    if (data.node_mem != null) {
      total.append(el('span', 'total-sep', '·'), el('span', 'total-label', 'node'),
                   document.createTextNode(fmtMem(data.node_mem)));
      total.title += `\nnode: the whole node(s), ${fmtMem(data.node_mem)} of ${fmtMem(data.node_alloc)} allocatable. ` +
        'Includes the k3s server process (API server, controllers, kubelet), containerd, kernel and active file cache.';
    }
    for (const g of data.groups) {
      const group = el('section', `group ${g.state}`);
      // a group with anything amber/red is always open, so problems are never hidden
      const forced = g.state !== 'green';
      if (forced) group.classList.add('forced');
      else if (collapsed.has(g.group)) group.classList.add('collapsed');
      const head = el('div', 'group-head');
      head.append(el('span', 'chevron', '▾'), el('span', `dot ${g.state}`), el('span', 'group-name', g.group),
                  el('span', 'group-count', `${g.items.length}`), el('span', 'group-mem', fmtMem(g.mem)));
      head.title = `${g.group}: ${fmtMem(g.mem)} working-set memory across ${g.items.length} items` +
        (forced ? ' - kept open: not all green' : ' - click to collapse/expand');
      head.setAttribute('role', 'button');
      head.setAttribute('aria-expanded', String(!group.classList.contains('collapsed')));
      head.addEventListener('click', () => {
        if (forced) return;
        const now = group.classList.toggle('collapsed');
        head.setAttribute('aria-expanded', String(!now));
        if (now) collapsed.add(g.group); else collapsed.delete(g.group);
        saveCollapsed(collapsed);
      });
      const rows = el('div', 'rows');
      for (const i of g.items) {
        const row = el(i.link ? 'a' : 'div', 'row');
        if (i.link) row.href = i.link;
        row.title = [i.link && `Open ${i.name} in Headlamp`, i.mem != null && `memory ${fmtMem(i.mem)}`]
          .filter(Boolean).join(' · ');
        const name = el('span', 'row-name');
        if (i.namespace) name.append(el('span', 'ns', i.namespace));
        name.append(document.createTextNode(i.name));
        row.append(el('span', `dot ${i.state}`), name,
                   el('span', 'count', i.desired != null ? `${i.ready}/${i.desired}` : ''));
        if (i.state !== 'green' && i.reason) row.append(el('div', `reason ${i.state}`, i.reason));
        rows.append(row);
      }
      group.append(head, rows);
      box.append(group);
    }
    const t = new Date(data.updated);
    document.getElementById('updated').textContent = `updated ${t.toLocaleTimeString()}`;
  }

  // --- ports ---
  function renderPorts(data) {
    const body = document.getElementById('ports');
    body.replaceChildren();
    for (const p of data.ports) {
      const tr = el('tr', p.state === 'none' ? 'none' : '');
      const dot = el('td', 'dotcell');
      dot.append(el('span', `dot ${p.state === 'none' ? '' : p.state}`));
      const host = el('td', 'hostport', p.host);
      host.title = `${p.proto}, via ${p.via || '?'}` + (p.node_port ? ` -> node port ${p.node_port}` : '');
      const dest = el('td', 'dest');
      if (p.service) {
        const target = p.link ? el('a') : el('span');
        if (p.link) { target.href = p.link; target.title = `Open service ${p.namespace}/${p.service} in Headlamp`; }
        if (p.namespace) target.append(el('span', 'ns', p.namespace));
        target.append(document.createTextNode(p.service));
        dest.append(target, document.createTextNode(' '));
        const detail = p.external ? `:${p.target}` : `:${p.svc_port} → ${p.target}`;
        dest.append(el('span', 'mono', detail));
        if (p.note) dest.append(el('span', 'sub', p.note));
      } else {
        dest.append(el('span', 'mono', `node port ${p.node_port}`));
      }
      if (p.reason) dest.append(el('span', `sub ${p.state === 'red' ? 'red' : ''}`, p.reason));
      const eps = el('td', 'mono', p.endpoints != null ? `${p.ready}/${p.endpoints}` : '');
      eps.title = 'ready endpoints';
      tr.append(dot, host, el('td', 'arrow', '→'), dest, eps);
      body.append(tr);
    }
    if (!data.ports.length) {
      const tr = el('tr');
      tr.append(el('td', 'mono', 'no ports mapped in k3d.yaml'));
      body.append(tr);
    }
  }

  async function refreshPorts() {
    try {
      const r = checkAuth(await fetch('cnav/api/ports', { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      renderPorts(data);
    } catch (err) {
      const tr = el('tr');
      tr.append(el('td', 'mono', `ports unavailable: ${err.message}`));
      document.getElementById('ports').replaceChildren(tr);
    }
  }

  // --- ports | credentials tabs ---
  const ICONS = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  };
  function iconButton(icon, label) {
    const b = el('button', 'icon-btn');
    b.type = 'button';
    b.innerHTML = ICONS[icon];   // static markup from ICONS only
    b.title = label;
    b.setAttribute('aria-label', label);
    return b;
  }

  const TABS = ['events', 'ports', 'creds'];
  function showTab(name) {
    if (!TABS.includes(name)) name = 'events';
    for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.tab === name));
    for (const t of TABS) document.getElementById(`pane-${t}`).hidden = t !== name;
    for (const x of document.querySelectorAll('.dock-head [data-for]')) x.hidden = x.dataset.for !== name;
    try { localStorage.setItem('cnav.dock.tab', name); } catch {}
    if (name === 'creds') refreshCredentials();
  }
  for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => showTab(b.dataset.tab));

  // values are fetched per row, only when revealed or copied, and kept in memory for this page
  const credValues = new Map();
  async function credentialValues(id) {
    if (!credValues.has(id)) {
      const r = checkAuth(await fetch(`cnav/api/credentials/${encodeURIComponent(id)}`, { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      credValues.set(id, data.values);
    }
    return credValues.get(id);
  }

  const MASK = '••••••••';
  async function copyText(btn, text) {
    try {
      await navigator.clipboard.writeText(text);
      btn.innerHTML = ICONS.check; btn.classList.add('done');
      setTimeout(() => { btn.innerHTML = ICONS.copy; btn.classList.remove('done'); }, 1200);
    } catch (err) { btn.title = `Copy failed: ${err.message}`; }
  }
  let secretFields = [];   // setShown(bool) per masked field on the page
  const unmaskBtn = document.getElementById('creds-unmask');
  function setUnmaskAll(on) {
    unmaskBtn.setAttribute('aria-pressed', String(on));
    unmaskBtn.textContent = on ? 'mask all' : 'unmask all';
    unmaskBtn.title = on ? 'Hide every secret value again' : 'Show every secret value in this list';
  }
  unmaskBtn.addEventListener('click', () => {
    const on = unmaskBtn.getAttribute('aria-pressed') !== 'true';
    setUnmaskAll(on);
    for (const setShown of secretFields) setShown(on);
  });

  function renderCredentials(data) {
    secretFields = [];
    setUnmaskAll(false);   // a fresh list starts masked
    const body = document.getElementById('creds');
    body.replaceChildren();
    for (const c of data.credentials) {
      const tr = el('tr');
      const name = el('td', 'cname');
      const isUrl = c.where && (c.where.startsWith('/') || /^https?:/.test(c.where));
      const title = isUrl ? el('a') : el('span');
      if (isUrl) { title.href = c.where; title.target = '_blank'; title.rel = 'noopener'; title.title = `Open ${c.where}`; }
      title.textContent = c.name;
      name.append(title);
      if (c.where) name.append(el('span', 'csub mono', c.where));
      if (c.source === 'discovered') name.append(el('span', 'csub mono', `secret-store/${c.entry}`));
      if (c.note) name.append(el('span', 'csub', c.note));
      const vals = el('td', 'cvals');
      if (c.missing) {
        vals.append(el('span', 'csub', `not in the secret store yet (entry ${c.entry}; run mise run secrets:sync)`));
      } else {
        const kv = el('div', 'kv');
        for (const f of c.fields) {
          const key = f.key;
          const btns = el('span', 'cbtns');
          if (!f.secret) {   // usernames, db names: shown as is, just a copy button
            const copy = iconButton('copy', `Copy ${key}`);
            copy.addEventListener('click', () => copyText(copy, f.value ?? ''));
            btns.append(copy);
            kv.append(el('span', 'k', key), el('span', 'v', f.value ?? ''), btns);
            continue;
          }
          const v = el('span', 'v masked', MASK);
          const eye = iconButton('eye', `Show ${key}`);
          const copy = iconButton('copy', `Copy ${key}`);
          const setShown = async (show) => {
            if (!show) {
              v.textContent = MASK; v.classList.add('masked');
              eye.innerHTML = ICONS.eye; eye.title = `Show ${key}`;
              return;
            }
            try {
              const values = await credentialValues(c.id);
              v.textContent = values[key] ?? ''; v.classList.remove('masked');
              eye.innerHTML = ICONS.eyeOff; eye.title = `Hide ${key}`;
            } catch (err) { v.textContent = `unavailable: ${err.message}`; }
          };
          secretFields.push(setShown);
          eye.addEventListener('click', () => setShown(v.classList.contains('masked')));
          copy.addEventListener('click', async () => {
            try { copyText(copy, (await credentialValues(c.id))[key] ?? ''); }
            catch (err) { copy.title = `Copy failed: ${err.message}`; }
          });
          btns.append(eye, copy);
          kv.append(el('span', 'k', key), v, btns);
        }
        vals.append(kv);
      }
      tr.append(name, vals);
      body.append(tr);
    }
    if (!data.credentials.length) {
      const tr = el('tr');
      tr.append(el('td', 'mono', 'no credentials'));
      body.append(tr);
    }
  }

  async function refreshCredentials() {
    credValues.clear();   // re-read values on the next reveal (a secrets:sync may have changed them)
    try {
      const r = checkAuth(await fetch('cnav/api/credentials', { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      renderCredentials(data);
    } catch (err) {
      const tr = el('tr');
      tr.append(el('td', 'mono', `credentials unavailable: ${err.message}`));
      document.getElementById('creds').replaceChildren(tr);
    }
  }
  try { showTab(localStorage.getItem('cnav.dock.tab') || 'events'); } catch { showTab('events'); }

  // --- events ---
  // filters: "all" adds routine events (server side), "severe" keeps only red/amber rows (here);
  // they exclude each other
  const eventsAll = document.getElementById('events-all');
  const eventsSevere = document.getElementById('events-severe');
  let lastEvents = null;
  try {
    eventsAll.checked = localStorage.getItem('cnav.events.all') === '1';
    eventsSevere.checked = !eventsAll.checked && localStorage.getItem('cnav.events.severe') === '1';
  } catch {}
  function saveEventFilters() {
    try {
      localStorage.setItem('cnav.events.all', eventsAll.checked ? '1' : '0');
      localStorage.setItem('cnav.events.severe', eventsSevere.checked ? '1' : '0');
    } catch {}
  }
  eventsAll.addEventListener('change', () => {
    if (eventsAll.checked) eventsSevere.checked = false;
    saveEventFilters();
    refreshEvents();
  });
  eventsSevere.addEventListener('change', () => {
    if (eventsSevere.checked && eventsAll.checked) { eventsAll.checked = false; saveEventFilters(); refreshEvents(); return; }
    saveEventFilters();
    if (lastEvents) renderEvents(lastEvents);
  });
  document.getElementById('events-refresh').addEventListener('click', refreshEvents);

  function shortAge(ts) {
    const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 60) return `${Math.floor(s)}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d`;
  }

  function renderEvents(data) {
    lastEvents = data;
    const body = document.getElementById('events');
    body.replaceChildren();
    const span = data.source === 'loki' ? 'last 72h' : 'last hour (Kubernetes API; Loki not answering)';
    const rows = eventsSevere.checked ? data.events.filter(e => e.severity !== 'normal') : data.events;
    const hidden = eventsSevere.checked ? `, ${data.events.length - rows.length + data.routine} hidden`
      : !eventsAll.checked && data.routine ? `, ${data.routine} routine hidden` : '';
    document.getElementById('events-sub').textContent = span + hidden;
    for (const e of rows) {
      const tr = el('tr');
      const age = el('td', 'age', e.ts ? shortAge(e.ts) : '');
      if (e.ts) age.title = new Date(e.ts).toLocaleString();
      const kind = el('td', 'kind');
      const label = el('span', `etype ${e.severity}${e.type === 'deploy' ? ' deploy' : ''}`, e.type);
      label.title = `${e.event_type || ''} ${e.reason || ''}`.trim();
      kind.append(label);
      if (e.count > 1) kind.append(el('span', 'ecount', `×${e.count}`));
      const comp = el('td', 'comp');
      const target = e.link ? el('a') : el('span');
      if (e.link) { target.href = e.link; target.title = `Open ${e.kind} ${e.namespace ? e.namespace + '/' : ''}${e.name} in Headlamp`; }
      else target.title = `${e.kind || ''} ${e.name || ''}`.trim();
      if (e.namespace) target.append(el('span', 'ns', e.namespace));
      target.append(document.createTextNode(e.component || e.name || ''));
      comp.append(target);
      const msg = el('td', 'msgcell');
      const text = el('div', 'msg', e.message);
      text.title = `${e.reason}: ${e.message}`;
      msg.append(text);
      tr.append(age, kind, comp, msg);
      body.append(tr);
    }
    if (!rows.length) {
      const tr = el('tr');
      tr.append(el('td', 'mono', eventsSevere.checked ? 'no problems' : eventsAll.checked ? 'no events'
        : 'no notable events (tick "all" for routine ones)'));
      body.append(tr);
    }
  }

  let eventsInFlight = false;
  async function refreshEvents() {
    if (eventsInFlight) return;
    eventsInFlight = true;
    const btn = document.getElementById('events-refresh');
    btn.classList.add('spinning');
    try {
      const r = checkAuth(await fetch(`cnav/api/events${eventsAll.checked ? '?all=1' : ''}`, { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      renderEvents(data);
    } catch (err) {
      const tr = el('tr');
      tr.append(el('td', 'mono', `events unavailable: ${err.message}`));
      document.getElementById('events').replaceChildren(tr);
    } finally {
      eventsInFlight = false;
      btn.classList.remove('spinning');
    }
  }

  // countdown bar: full width, then shrinks to nothing over REFRESH_MS
  function startCountdown() {
    const bar = document.getElementById('countdown');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    void bar.offsetWidth;                       // commit the reset before animating
    bar.style.transition = `width ${REFRESH_MS}ms linear`;
    bar.style.width = '0%';
  }

  let timer = null, inFlight = false;
  async function refreshStatus() {
    if (inFlight) return;
    inFlight = true;
    clearTimeout(timer);
    const btn = document.getElementById('refresh');
    btn.classList.add('spinning');
    refreshPorts();   // same cycle; each renders on its own when done
    refreshEvents();
    try {
      const r = checkAuth(await fetch('cnav/api/status', { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      renderStatus(data);
    } catch (err) {
      document.getElementById('updated').textContent = `status unavailable: ${err.message}`;
    } finally {
      inFlight = false;
      btn.classList.remove('spinning');
      timer = setTimeout(refreshStatus, REFRESH_MS);   // next automatic refresh, counted from now
      startCountdown();
    }
  }
  document.getElementById('refresh').addEventListener('click', refreshStatus);
  refreshStatus();
</script>
</body>
</html>
