# pg/postgres-app: the app database login, synced from the secret store (postgres-app, defaults in
# components/postgres/secrets.defaults.toml) + connection strings built by ESO's template.
# Postgres uses the password only when it first initializes runtime.data/postgres.
apiVersion: v1
kind: Namespace
metadata:
  name: pg
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app
  namespace: pg
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target:
    name: postgres-app
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        dbname: "{{ .dbname }}"
        host: postgres-rw.pg.svc
        port: "5432"
        uri: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.pg.svc:5432/{{ .dbname }}"
        jdbc-uri: "jdbc:postgresql://postgres-rw.pg.svc:5432/{{ .dbname }}?user={{ .username }}&password={{ .password }}"
  dataFrom:
    - extract: {key: postgres-app}
