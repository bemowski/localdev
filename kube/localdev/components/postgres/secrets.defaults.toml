# Postgres entries of the localdev secret store: fixed local dev credentials (override in
# secrets.store.toml). Synced to pg/postgres-app by components/postgres/manifests/30-1-postgres-secrets.yaml.
# Postgres applies them only when it initializes its data (runtime.data/postgres): changing them
# later doesn't change the database's password.
[postgres-app]
username = "app"
password = "localdev"
dbname = "app"
