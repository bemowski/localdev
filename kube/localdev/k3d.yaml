# k3d cluster config — used by `mise run cluster:create`
# The manifests/ volume is passed on the command line by `mise run cluster:create`.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: localdev
servers: 1
agents: 0
image: rancher/k3s:v1.36.5-k3s1   # k3s stable channel
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
# Persistent host data (gitignored, wiped by `mise run cluster:clean`). ${LOCALDEV_ROOT} is set
# by .mise.toml; k3d expands env vars here, and host paths must be absolute.
volumes:
  - volume: ${LOCALDEV_ROOT}/runtime.data:/runtime.data   # e.g. postgres -> /runtime.data/postgres
    nodeFilters:
      - server:0
  # Grafana provisions dashboards from here, live (see manifests/20-infra/20-2-monitoring.yaml)
  - volume: ${LOCALDEV_ROOT}/grafana/dashboards:/grafana-dashboards
    nodeFilters:
      - server:0
registries:
  create:
    name: localdev-registry
    host: "0.0.0.0"
    hostPort: "5005"
    volumes:
      - ${LOCALDEV_ROOT}/runtime.data/registry:/var/lib/registry   # images survive recreate
      - ${LOCALDEV_ROOT}/registry/config.yml:/etc/docker/registry/config.yml   # + /metrics on :5001
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
