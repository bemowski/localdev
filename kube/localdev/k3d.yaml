# k3d cluster config — used by `mise run cluster:create`
# The manifests/ volume is passed on the command line by `mise run cluster:create`.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: localdev
servers: 1
agents: 0
image: rancher/k3s:v1.36.5-k3s1   # k3s stable channel
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  # tools, reachable from this machine only (127.0.0.1); answered by a LoadBalancer Service in the
  # component when it's installed, otherwise the connection is refused. A running cluster picks up
  # a new mapping with `k3d cluster edit localdev --port-add <spec>@loadbalancer` (or cluster:recreate).
  - port: 127.0.0.1:5432:5432   # postgres (components/postgres: pg/postgres-local)
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:4222:4222   # nats (components/nats: nats/nats-local)
    nodeFilters:
      - loadbalancer
# Persistent host data (gitignored, wiped by `mise run cluster:clean`). ${LOCALDEV_ROOT} is set
# by .mise.toml; k3d expands env vars here, and host paths must be absolute.
volumes:
  - volume: ${LOCALDEV_ROOT}/runtime.data:/runtime.data   # e.g. postgres -> /runtime.data/postgres
    nodeFilters:
      - server:0
  # The repo, read-only, so the profile's links (runtime.profile/, see profile.py) resolve inside
  # the cluster: k3s follows the absolute dir links (same path as on the host); Grafana reads its
  # relative file links under /localdev.
  - volume: ${LOCALDEV_ROOT}:${LOCALDEV_ROOT}:ro
    nodeFilters:
      - server:0
  - volume: ${LOCALDEV_ROOT}:/localdev:ro
    nodeFilters:
      - server:0
registries:
  create:
    name: localdev-registry
    host: "0.0.0.0"
    hostPort: "5005"
    volumes:
      - ${LOCALDEV_ROOT}/runtime.data/registry:/var/lib/registry   # images survive recreate
      - ${LOCALDEV_ROOT}/registry/config.yml:/etc/docker/registry/config.yml   # + /metrics on :5001
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
