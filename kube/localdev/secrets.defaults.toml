# Platform/infra entries of the localdev secret store (committed: no real secrets here).
# "" = required: set it in your gitignored secrets.store.toml (`mise run secrets:migrate` creates it
# from an old secrets.env). Components add their own in components/<c>/secrets.defaults.toml.
# Consumers read these through ExternalSecrets on ClusterSecretStore `localdev` (see the docs: Secrets).

[sso]                          # oauth2-proxy: Google OAuth client + cookie secret (readme: Google OAuth setup)
google-client-id = ""
google-client-secret = ""
cookie-secret = ""             # 32 bytes: openssl rand -base64 32 | tr -- '+/' '-_'

[localdev-admin]               # local sign-in (oauth2-proxy form), Grafana admin, Keycloak bootstrap admin
username = "admin"
password = ""
