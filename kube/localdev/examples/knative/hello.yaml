# A Knative Service: deploy a container, get a cluster-local URL, autoscaling incl. scale-to-zero.
#   kubectl apply -f examples/knative/hello.yaml        (or: kn service create ...)
#   call it from any pod:  curl http://hello.demo.svc.cluster.local
#   from your desktop:     mise run kn:forward      (then curl -H 'Host: hello.demo.svc.cluster.local' localhost:8081)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: demo
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"     # scale to zero when idle (default)
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          env:
            - {name: TARGET, value: localdev}
