# localdev docs: markdown in content/, rendered to HTML when the docs image is built
# (`mise run build docs`, components/docs). Add a page: create content/<page>.md and list it in nav.
site_name: localdev
site_description: Ephemeral local Kubernetes (k3d) for development
site_url: http://localhost/docs/
docs_dir: content

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Cluster layout: cluster-layout.md
  - Components: components.md

theme:
  name: material
  font: false                 # system fonts: nothing loaded from Google, works offline
  icon:
    logo: material/kubernetes
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
