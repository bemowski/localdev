# Components for a localdev cluster. Each is a folder in components/:
#   components/<name>/manifests/    deployed by k3s
#   components/<name>/dashboards/   shown in Grafana's "tools" folder (optional)
#   components/<name>/docker/       image built by `mise run build <name>` (optional)
#   components/<name>/build.sh      custom image build, used instead of docker/ (optional)
# platform, infra and apps (manifests/, grafana/dashboards/) are always deployed.
# local.toml (gitignored, same format) adds your own profiles, a `default`, and EXTERNAL components
# living in other projects: [components.myapp] path = "../../../myapp/localdev" (see the docs).
#
#   mise run cluster:create [profile]   create with a profile (default below, or the last one used)
#   mise run cluster:profile            list profiles
#   mise run cluster:profile <profile>  switch a running cluster (adds/removes tools live)

default = "dev"

[profiles]
lite    = { description = "Core only: SSO, observability, registry, cnav", components = [] }
dev     = { description = "App development: Postgres + NATS + docs", components = ["postgres", "nats", "docs"] }
knative = { description = "Serverless and eventing", components = ["postgres", "nats", "knative", "docs"] }
auth    = { description = "Identity: Postgres + Keycloak + docs", components = ["postgres", "keycloak", "docs"] }
full    = { description = "Everything", components = ["postgres", "nats", "knative", "keycloak", "docs"] }

# Extra component metadata. Components themselves are discovered from components/*/.
#   requires = [...]   other components it needs (auto-included)
#   layer = "..."      where its manifests land in runtime.profile/manifests/:
#                      platform | infra | tools (default) | apps  - earlier layers deploy first
#   always = true      part of every profile (not listed in [profiles])
[components.keycloak]
requires = ["postgres"]

[components.cnav]
layer = "infra"                # deploy with infra, before the tools
always = true

[components.usage-agent]
path = "../components/usage/cluster-agent"   # external: lives with the usage project (kube/components/usage)
layer = "infra"                              # kube-system; sends this cluster's usage events
always = true                                # every profile, with or without a usage server (it spools)

[components.external-secrets]
layer = "infra"                # apps' ExternalSecrets need it; local store: secrets.store.toml
always = true
