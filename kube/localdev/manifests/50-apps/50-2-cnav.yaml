# Cluster navigator at / — cards linking to the apps, plus a live status column. Behind SSO.
# Image: apps/cnav (Python), built and pushed by `mise run build cnav`.
# Edit cards.yaml / status.yaml below; the page picks them up within ~a minute, no rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnav-config
  namespace: cnav
data:
  cards.yaml: |
    - component: Headlamp
      icon: 🔦
      link: /headlamp/
      description: Kubernetes dashboard
    - component: Grafana
      icon: 📊
      link: /grafana/
      description: Dashboards, metrics and logs
    - component: Prometheus
      icon: 🔥
      link: /prometheus/
      description: Metrics and scrape targets
    - component: Registry
      icon: 📦
      link: /registry/
      description: Images in the localdev registry
    - component: pgweb
      icon: 🐘
      link: /pgweb/
      description: Postgres (pg/postgres-rw), app database
    - component: NATS
      icon: 📨
      link: /nats/
      description: "NUI: subjects, JetStream streams, KV"
    - component: whoami
      icon: 👋
      link: /whoami
      description: SSO test app, echoes request headers
  # Groups -> items -> checks; an item's light is the worst of its checks.
  # kinds: Deployment | StatefulSet | DaemonSet (namespace, name) | HelmChart (name)
  # optional per item: namespace (display override for the prefix), link
  status.yaml: |
    - group: platform
      items:
        - name: Traefik
          checks:
            - {kind: Deployment, namespace: kube-system, name: traefik}
            - {kind: HelmChart, name: traefik}
        - name: oauth2-proxy
          checks:
            - {kind: Deployment, namespace: auth, name: oauth2-proxy}
            - {kind: HelmChart, name: oauth2-proxy}
        - name: CoreDNS
          checks:
            - {kind: Deployment, namespace: kube-system, name: coredns}
    - group: infra
      items:
        - name: Headlamp
          checks:
            - {kind: Deployment, namespace: headlamp, name: headlamp}
            - {kind: HelmChart, name: headlamp}
        - name: Prometheus
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: prometheus-kps-prometheus}
            - {kind: Deployment, namespace: monitoring, name: kps-operator}
            - {kind: HelmChart, name: kube-prometheus-stack}
        - name: Grafana
          checks:
            - {kind: Deployment, namespace: monitoring, name: grafana}
        - name: Alertmanager
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: alertmanager-kps-alertmanager}
        - name: Exporters
          checks:
            - {kind: DaemonSet, namespace: monitoring, name: kube-prometheus-stack-prometheus-node-exporter}
            - {kind: Deployment, namespace: monitoring, name: kube-prometheus-stack-kube-state-metrics}
        - name: Loki
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: loki}
            - {kind: HelmChart, name: loki}
        - name: Alloy (logs + OTLP)
          checks:
            - {kind: Deployment, namespace: monitoring, name: alloy}
            - {kind: HelmChart, name: alloy}
        - name: Tempo
          checks:
            - {kind: StatefulSet, namespace: monitoring, name: tempo}
            - {kind: HelmChart, name: tempo}
    - group: tools
      items:
        - name: Registry UI
          checks:
            - {kind: Deployment, namespace: registry, name: registry-ui}
        - name: Postgres
          checks:
            - {kind: StatefulSet, namespace: pg, name: postgres}
        - name: pgweb
          checks:
            - {kind: Deployment, namespace: pg, name: pgweb}
        - name: NATS
          checks:
            - {kind: StatefulSet, namespace: nats, name: nats}
            - {kind: HelmChart, name: nats}
        - name: NUI
          checks:
            - {kind: Deployment, namespace: nats, name: nui}
        - name: nats-box
          checks:
            - {kind: Deployment, namespace: nats, name: nats-box}
        - name: Knative operator
          namespace: kn-operator     # display only; real ns knative-operator
          checks:
            - {kind: Deployment, namespace: knative-operator, name: knative-operator}
            - {kind: Deployment, namespace: knative-operator, name: operator-webhook}
            - {kind: HelmChart, name: knative-operator}
        - name: Knative Serving
          namespace: kn-serving     # display only; real ns knative-serving
          checks:
            - {kind: Deployment, namespace: knative-serving, name: activator}
            - {kind: Deployment, namespace: knative-serving, name: autoscaler}
            - {kind: Deployment, namespace: knative-serving, name: controller}
            - {kind: Deployment, namespace: knative-serving, name: webhook}
            - {kind: Deployment, namespace: knative-serving, name: net-kourier-controller}
            - {kind: Deployment, namespace: knative-serving, name: 3scale-kourier-gateway}
        - name: Knative Eventing
          namespace: kn-eventing     # display only; real ns knative-eventing
          checks:
            - {kind: Deployment, namespace: knative-eventing, name: eventing-controller}
            - {kind: Deployment, namespace: knative-eventing, name: eventing-webhook}
            - {kind: Deployment, namespace: knative-eventing, name: imc-controller}
            - {kind: Deployment, namespace: knative-eventing, name: imc-dispatcher}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-controller}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-filter}
            - {kind: Deployment, namespace: knative-eventing, name: mt-broker-ingress}
    - group: apps
      items:
        - name: whoami
          checks:
            - {kind: Deployment, namespace: demo, name: whoami}
        - name: cnav
          checks:
            - {kind: Deployment, namespace: cnav, name: cnav}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnav
  namespace: cnav
---
# read-only: just what /api/status looks at
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnav-status
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get]
  - apiGroups: ["helm.cattle.io"]
    resources: [helmcharts]
    verbs: [get]
  - apiGroups: ["metrics.k8s.io"]     # memory rollups (metrics-server)
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [""]                   # node allocatable memory (header tooltip)
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnav-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnav-status
subjects:
  - kind: ServiceAccount
    name: cnav
    namespace: cnav
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnav
  namespace: cnav
  labels: {app: cnav}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnav}
  template:
    metadata:
      labels: {app: cnav}
    spec:
      serviceAccountName: cnav
      enableServiceLinks: false   # no CNAV_PORT=tcp://... style env vars
      containers:
        - name: cnav
          image: localdev-registry:5005/cnav:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - name: config
              mountPath: /etc/cnav   # whole dir (not subPath) so ConfigMap edits propagate
      volumes:
        - name: config
          configMap:
            name: cnav-config
---
apiVersion: v1
kind: Service
metadata:
  name: cnav
  namespace: cnav
spec:
  selector: {app: cnav}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: cnav
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/   # signed in: 202 + identity headers; signed out: sign-in page (allow-list: 10-2-oauth2-proxy.yaml)
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnav
  namespace: cnav
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: cnav-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /          # catch-all; longer app paths still win
            pathType: Prefix
            backend:
              service:
                name: cnav
                port:
                  number: 80
---
# The only cnav page outside SSO: where /oauth2/sign_out?rd=/signed-out lands.
# Exact match, so nothing else on cnav becomes public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnav-public
  namespace: cnav
spec:
  rules:
    - http:
        paths:
          - path: /signed-out
            pathType: Exact
            backend:
              service:
                name: cnav
                port:
                  number: 80
