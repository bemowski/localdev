# Cluster navigator at / — cards with links to the other apps. Behind SSO.
# Image: apps/cnav, built and pushed by `mise run build cnav`.
# Edit the cards below; the page picks them up within ~a minute, no rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnav-cards
  namespace: cnav
data:
  cards.yaml: |
    - component: Headlamp
      icon: 🔦
      link: /headlamp/
      description: Kubernetes dashboard
    - component: Grafana
      icon: 📊
      link: /grafana/
      description: Dashboards, metrics and logs
    - component: Prometheus
      icon: 🔥
      link: /prometheus/
      description: Metrics and scrape targets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnav
  namespace: cnav
  labels: {app: cnav}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnav}
  template:
    metadata:
      labels: {app: cnav}
    spec:
      containers:
        - name: cnav
          image: localdev-registry:5005/cnav:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts:
            - name: cards
              mountPath: /etc/cnav   # whole dir (not subPath) so ConfigMap edits propagate
      volumes:
        - name: cards
          configMap:
            name: cnav-cards
---
apiVersion: v1
kind: Service
metadata:
  name: cnav
  namespace: cnav
spec:
  selector: {app: cnav}
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: cnav
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth?allowed_emails=bemowski@gmail.com
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnav
  namespace: cnav
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-auth-errors@kubernetescrd,cnav-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /          # catch-all; longer app paths still win
            pathType: Prefix
            backend:
              service:
                name: cnav
                port:
                  number: 80
