# SSO test app at /whoami — echoes request headers (look for X-Auth-Request-Email)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: demo
spec:
  selector: {app: whoami}
  ports:
    - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip
  namespace: demo
spec:
  stripPrefix:
    prefixes: [/whoami]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: demo
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth   # allow-list: 10-2-oauth2-proxy.yaml
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-auth-errors@kubernetescrd,demo-sso@kubernetescrd,demo-strip@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /whoami
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
