# Logs: Loki (single binary, filesystem) + Alloy tailing every pod via the k8s API.
# Alloy is also the cluster's OpenTelemetry collector: apps send OTLP to
#   alloy.monitoring.svc:4317 (gRPC) / :4318 (HTTP)
# and it routes metrics -> Prometheus, logs -> Loki, traces -> Tempo (20-5-tracing.yaml).
# Query in Grafana -> Explore. No UI of its own, so no ingress.
# Loki's data is in runtime.data/loki (kept 72h), so logs survive `mise run cluster:recreate`.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: kube-system
spec:
  repo: https://grafana.github.io/helm-charts
  chart: loki
  version: 7.3.0
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index: {prefix: index_, period: 24h}
      # data persists in runtime.data/loki, so delete old logs (default: keep forever)
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 72h
    singleBinary:
      replicas: 1
      # /var/loki in runtime.data/loki: PV loki-data below
      persistence:
        storageClass: runtime-data
        enableStatefulSetAutoDeletePVC: false   # keep the claim (and its PV binding) if the StatefulSet is replaced
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"   # runtime.data is on the server node
      # loki runs as 10001; the hostPath dir starts root-owned (fsGroup doesn't apply)
      initContainers:
        - name: chown-data
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
          securityContext: {runAsUser: 0, runAsNonRoot: false}
          volumeMounts:
            - {name: storage, mountPath: /var/loki}
    read: {replicas: 0}
    write: {replicas: 0}
    backend: {replicas: 0}
    gateway: {enabled: false}
    chunksCache: {enabled: false}
    resultsCache: {enabled: false}
    lokiCanary: {enabled: false}
    test: {enabled: false}
---
# Loki's data in runtime.data/loki (survives `mise run cluster:recreate`). hostPath on the server
# node, bound by name; class runtime-data has no provisioner (see 20-2-monitoring.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-data
spec:
  storageClassName: runtime-data
  capacity: {storage: 10Gi}            # nominal: hostPath isn't size-limited (retention_period is)
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  claimRef: {namespace: monitoring, name: storage-loki-0}
  hostPath: {path: /runtime.data/loki, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: alloy
  namespace: kube-system
spec:
  repo: https://grafana.github.io/helm-charts
  chart: alloy
  version: 1.13.0
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    # Tails logs through the API server, not host paths: one replica covers every node.
    controller:
      type: deployment
      replicas: 1
    alloy:
      extraPorts:
        - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP, appProtocol: grpc}
        - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
      configMap:
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
              separator     = ";"
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }

          // ---- OpenTelemetry: OTLP in, one exporter per signal --------------------
          otelcol.receiver.otlp "default" {
            grpc { endpoint = "0.0.0.0:4317" }
            http { endpoint = "0.0.0.0:4318" }
            output {
              metrics = [otelcol.processor.k8sattributes.default.input]
              logs    = [otelcol.processor.k8sattributes.default.input]
              traces  = [otelcol.processor.k8sattributes.default.input]
            }
          }

          // tag everything with the sending pod's namespace/pod/deployment (matched by source IP)
          otelcol.processor.k8sattributes "default" {
            extract {
              metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.deployment.name", "k8s.container.name", "k8s.node.name"]
            }
            output {
              metrics = [otelcol.processor.batch.default.input]
              logs    = [otelcol.processor.batch.default.input]
              traces  = [otelcol.processor.batch.default.input]
            }
          }

          otelcol.processor.batch "default" {
            output {
              metrics = [otelcol.exporter.otlphttp.prometheus.input]
              logs    = [otelcol.exporter.otlphttp.loki.input]
              traces  = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Prometheus native OTLP receiver (exporter appends /v1/metrics)
          otelcol.exporter.otlphttp "prometheus" {
            client { endpoint = "http://kps-prometheus.monitoring.svc:9090/prometheus/api/v1/otlp" }
          }

          // Loki 3 native OTLP endpoint (exporter appends /v1/logs); trace_id kept as structured metadata
          otelcol.exporter.otlphttp "loki" {
            client { endpoint = "http://loki.monitoring.svc:3100/otlp" }
          }

          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.monitoring.svc:4317"
              tls { insecure = true }
            }
          }
