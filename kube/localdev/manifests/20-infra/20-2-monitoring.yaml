# kube-prometheus-stack at /grafana, /prometheus, /alertmanager — all behind SSO.
# Grafana trusts the X-Auth-Request-Email header from oauth2-proxy (no second login).
# Prometheus and Grafana keep their data in runtime.data/{prometheus,grafana} (static hostPath PVs at
# the end of this file), so it survives `mise run cluster:recreate`; Alertmanager's is ephemeral.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.1.0
  targetNamespace: monitoring
  createNamespace: true
  timeout: 10m
  valuesContent: |-
    fullnameOverride: kps

    # k3s embeds these in the server process; their scrape targets would be down forever
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeEtcd: {enabled: false}
    kubeProxy: {enabled: false}

    # k3d nodes are containers: / is not a shared mount
    prometheus-node-exporter:
      hostRootFsMount: {enabled: false}

    grafana:
      fullnameOverride: grafana
      admin:
        existingSecret: grafana-admin     # ExternalSecret 20-9-grafana-secrets.yaml (localdev-admin)
      annotations: {reloader.stakater.com/auto: "true"}   # roll when grafana-admin changes
      defaultDashboardsEnabled: false   # copies live in grafana/dashboards/{platform,infra}
      # Dashboards come from the active profile's view, runtime.profile/dashboards/ (links into
      # grafana/dashboards/ and components/*/dashboards/, see profile.py), read through the repo
      # mount at /localdev: one Grafana folder per directory, reloaded every 15s. The chart's
      # built-in dashboards were copied into grafana/dashboards, so they're switched off here.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      # grafana.db (UI-made dashboards, preferences) in runtime.data/grafana: PV grafana-data below;
      # the chart's initChownData chowns it to Grafana's uid
      persistence:
        enabled: true
        storageClassName: runtime-data
        volumeName: grafana-data
        size: 1Gi
      deploymentStrategy: {type: Recreate}   # one pod at a time on grafana.db (sqlite)
      # The admin password env only applies when grafana.db is first created; reset it on every start
      # so a changed localdev-admin password (Reloader restarts the pod) still takes effect.
      lifecycleHooks:
        postStart:
          exec:
            command:
              - sh
              - -c
              - for i in $(seq 30); do grafana cli --homepath /usr/share/grafana admin reset-admin-password "$GF_SECURITY_ADMIN_PASSWORD" >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0
      extraVolumes:
        - name: localdev-repo
          hostPath: {path: /localdev, type: Directory}
      extraVolumeMounts:
        - name: localdev-repo
          mountPath: /localdev
          readOnly: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: localdev
              type: file
              folder: ""
              allowUiUpdates: true          # edit in the UI, then `mise run grafana:export`
              updateIntervalSeconds: 15     # >10 = polling (re-reads files); <=10 uses fsnotify,
                                            # which never fires for edits to link targets
              options:
                path: /localdev/runtime.profile/dashboards
                foldersFromFilesStructure: true
      serviceMonitor:
        path: /grafana/metrics   # serve_from_sub_path redirects /metrics to root_url
      grafana.ini:
        server:
          domain: localhost
          root_url: "%(protocol)s://%(domain)s/grafana/"
          serve_from_sub_path: true
        auth:
          # Google sessions arrive with X-Auth-Request-Email (auth.proxy, no form). Local "admin"
          # SSO sessions have no email, so Grafana shows its form: admin / the localdev-admin password (secret store).
          disable_login_form: false
          disable_signout_menu: true
        auth.proxy:
          enabled: true
          header_name: X-Auth-Request-Email
          header_property: email
          auto_sign_up: true
          # issue Grafana's own session token on proxy login: the frontend rotates that token in
          # the background, and without one /api/user/auth-tokens/rotate 401s -> reload loop
          enable_login_token: true
        users:
          auto_assign_org_role: Admin   # the SSO allow-list is the gate
      sidecar:
        datasources:
          # Tempo span-metric exemplars carry `traceID`: clickable trace dots on Prometheus graphs
          exemplarTraceIdDestinations:
            datasourceUid: tempo
            traceIdLabelName: traceID
            urlDisplayLabel: View trace
      additionalDataSources:
        - name: Loki                    # deployed by 20-3-logging.yaml
          type: loki
          uid: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
          jsonData:
            derivedFields:              # OTLP logs carry trace_id as structured metadata -> Tempo
              - name: TraceID
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: "$${__value.raw}"           # $$ = literal $ in Grafana provisioning
                urlDisplayLabel: View trace
        - name: Tempo                   # deployed by 20-5-tracing.yaml
          type: tempo
          uid: tempo
          url: http://tempo.monitoring.svc:3200
          access: proxy
          jsonData:
            nodeGraph: {enabled: true}
            serviceMap: {datasourceUid: prometheus}       # Tempo metrics-generator service graph
            lokiSearch: {datasourceUid: loki}
            tracesToLogsV2:                                # span -> its logs (OTLP logs, same trace)
              datasourceUid: loki
              filterByTraceID: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - {key: service.name, value: service_name}
            tracesToMetrics:                               # span -> span-metrics rate/latency
              datasourceUid: prometheus
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - {key: service.name, value: service}
              queries:
                - name: Request rate
                  query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
                - name: p95 latency
                  query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'

    prometheus:
      prometheusSpec:
        routePrefix: /prometheus
        externalUrl: http://localhost/prometheus
        # TSDB in runtime.data/prometheus (PV below), bounded by time and size
        retention: 3d
        retentionSize: 5GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: runtime-data
              volumeName: prometheus-data
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 10Gi}}
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"   # runtime.data is on the server node
        # prometheus runs as 1000:2000; the hostPath dir starts root-owned (fsGroup doesn't apply)
        initContainers:
          - name: chown-data
            image: busybox:1.37
            command: ["sh", "-c", "chown -R 1000:2000 /prometheus"]
            securityContext: {runAsUser: 0, runAsNonRoot: false}
            volumeMounts:
              - {name: prometheus-kps-prometheus-db, mountPath: /prometheus}
        # OpenTelemetry: Alloy pushes app metrics via OTLP (/prometheus/api/v1/otlp), Tempo's
        # metrics generator pushes span metrics + service graph via remote write
        enableOTLPReceiver: true
        enableRemoteWriteReceiver: true
        enableFeatures: [exemplar-storage]          # metric points link to traces in Grafana
        otlp:
          promoteResourceAttributes:                # OTLP resource attrs -> labels (rest go to target_info)
            - service.namespace
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.container.name
        # pick up every ServiceMonitor/PodMonitor/rule in the cluster, not just this release's
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      alertmanagerSpec:
        routePrefix: /alertmanager
        externalUrl: http://localhost/alertmanager
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/   # signed in: 202 + identity headers; signed out: sign-in page (allow-list: [sso-access] in the secret store)
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: kps-prometheus
                port:
                  number: 9090
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: kps-alertmanager
                port:
                  number: 9093
---
# runtime.data PVs: hostPath on the server node, bound to their claim by name (volumeName).
# Class runtime-data has no provisioner, so k3s's local-path leaves these claims alone.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data
spec:
  storageClassName: runtime-data
  capacity: {storage: 10Gi}            # nominal: hostPath isn't size-limited (retentionSize is)
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  claimRef: {namespace: monitoring, name: prometheus-kps-prometheus-db-prometheus-kps-prometheus-0}
  hostPath: {path: /runtime.data/prometheus, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
spec:
  storageClassName: runtime-data
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  claimRef: {namespace: monitoring, name: grafana}
  hostPath: {path: /runtime.data/grafana, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
