# kube-prometheus-stack at /grafana, /prometheus, /alertmanager — all behind SSO.
# Grafana trusts the X-Auth-Request-Email header from oauth2-proxy (no second login).
# No persistence: data lives as long as the cluster.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.1.0
  targetNamespace: monitoring
  timeout: 10m
  valuesContent: |-
    fullnameOverride: kps

    # k3s embeds these in the server process; their scrape targets would be down forever
    kubeControllerManager: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeEtcd: {enabled: false}
    kubeProxy: {enabled: false}

    # k3d nodes are containers: / is not a shared mount
    prometheus-node-exporter:
      hostRootFsMount: {enabled: false}

    grafana:
      fullnameOverride: grafana
      admin:
        existingSecret: grafana-admin     # from `mise run secrets` (admin / LOCAL_ADMIN_PASSWORD)
      defaultDashboardsEnabled: false   # copies live in grafana/dashboards/{platform,infra}
      # Dashboards come from grafana/dashboards/<folder>/*.json in the repo (mounted into the
      # server node at /grafana-dashboards by k3d.yaml): one Grafana folder per directory,
      # reloaded every 10s. The chart's built-in dashboards were copied into that tree, so
      # they're switched off here.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      extraVolumes:
        - name: localdev-dashboards
          hostPath: {path: /grafana-dashboards, type: Directory}
      extraVolumeMounts:
        - name: localdev-dashboards
          mountPath: /var/lib/grafana/dashboards/localdev
          readOnly: true
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: localdev
              type: file
              folder: ""
              allowUiUpdates: true          # edit in the UI, then `mise run grafana:export`
              updateIntervalSeconds: 10
              options:
                path: /var/lib/grafana/dashboards/localdev
                foldersFromFilesStructure: true
      serviceMonitor:
        path: /grafana/metrics   # serve_from_sub_path redirects /metrics to root_url
      grafana.ini:
        server:
          domain: localhost
          root_url: "%(protocol)s://%(domain)s/grafana/"
          serve_from_sub_path: true
        auth:
          # Google sessions arrive with X-Auth-Request-Email (auth.proxy, no form). Local "admin"
          # SSO sessions have no email, so Grafana shows its form: admin / LOCAL_ADMIN_PASSWORD.
          disable_login_form: false
          disable_signout_menu: true
        auth.proxy:
          enabled: true
          header_name: X-Auth-Request-Email
          header_property: email
          auto_sign_up: true
        users:
          auto_assign_org_role: Admin   # the SSO allow-list is the gate
      sidecar:
        datasources:
          # Tempo span-metric exemplars carry `traceID`: clickable trace dots on Prometheus graphs
          exemplarTraceIdDestinations:
            datasourceUid: tempo
            traceIdLabelName: traceID
            urlDisplayLabel: View trace
      additionalDataSources:
        - name: Loki                    # deployed by 20-3-logging.yaml
          type: loki
          uid: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
          jsonData:
            derivedFields:              # OTLP logs carry trace_id as structured metadata -> Tempo
              - name: TraceID
                matcherType: label
                matcherRegex: trace_id
                datasourceUid: tempo
                url: "$${__value.raw}"           # $$ = literal $ in Grafana provisioning
                urlDisplayLabel: View trace
        - name: Tempo                   # deployed by 20-5-tracing.yaml
          type: tempo
          uid: tempo
          url: http://tempo.monitoring.svc:3200
          access: proxy
          jsonData:
            nodeGraph: {enabled: true}
            serviceMap: {datasourceUid: prometheus}       # Tempo metrics-generator service graph
            lokiSearch: {datasourceUid: loki}
            tracesToLogsV2:                                # span -> its logs (OTLP logs, same trace)
              datasourceUid: loki
              filterByTraceID: true
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - {key: service.name, value: service_name}
            tracesToMetrics:                               # span -> span-metrics rate/latency
              datasourceUid: prometheus
              spanStartTimeShift: "-5m"
              spanEndTimeShift: "5m"
              tags:
                - {key: service.name, value: service}
              queries:
                - name: Request rate
                  query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
                - name: p95 latency
                  query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'

    prometheus:
      prometheusSpec:
        routePrefix: /prometheus
        externalUrl: http://localhost/prometheus
        retention: 2d
        # OpenTelemetry: Alloy pushes app metrics via OTLP (/prometheus/api/v1/otlp), Tempo's
        # metrics generator pushes span metrics + service graph via remote write
        enableOTLPReceiver: true
        enableRemoteWriteReceiver: true
        enableFeatures: [exemplar-storage]          # metric points link to traces in Grafana
        otlp:
          promoteResourceAttributes:                # OTLP resource attrs -> labels (rest go to target_info)
            - service.namespace
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.container.name
        # pick up every ServiceMonitor/PodMonitor/rule in the cluster, not just this release's
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      alertmanagerSpec:
        routePrefix: /alertmanager
        externalUrl: http://localhost/alertmanager
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: monitoring
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth   # allow-list: 10-2-oauth2-proxy.yaml
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-auth-errors@kubernetescrd,monitoring-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: kps-prometheus
                port:
                  number: 9090
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: kps-alertmanager
                port:
                  number: 9093
