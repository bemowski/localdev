# oauth2-proxy: one SSO gate for every app (Traefik forwardAuth -> /oauth2/auth).
# Two ways to sign in, on one page:
#   - Google, for accounts in the allow-list below (authenticatedEmailsFile)
#   - local user "admin" (htpasswd), password LOCAL_ADMIN_PASSWORD from secrets.env
# Secrets auth/oauth2-proxy and auth/oauth2-proxy-htpasswd come from `mise run secrets`.
# Local (htpasswd) sessions have no email: the allow-list doesn't apply to them, and apps
# keyed on the email header (Grafana) show their own login instead.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: oauth2-proxy
  namespace: kube-system
spec:
  repo: https://oauth2-proxy.github.io/manifests
  chart: oauth2-proxy
  version: 10.7.1
  targetNamespace: auth
  valuesContent: |-
    config:
      existingSecret: oauth2-proxy
      emailDomains: []             # no domain-wide access: only the allow-list below
      upstreams: ["static://202"]
    # Google accounts allowed into localdev (one per line). Applies to every app.
    authenticatedEmailsFile:
      enabled: true
      restricted_access: |-
        bemowski@gmail.com
    htpasswdFile:
      enabled: true
      existingSecret: oauth2-proxy-htpasswd
    extraArgs:
      provider: google
      redirect-url: http://localhost/oauth2/callback
      reverse-proxy: true
      cookie-secure: false
      set-xauthrequest: true
      skip-provider-button: false  # sign-in page: Google button + username/password form
      display-htpasswd-form: true
      custom-sign-in-logo: "-"      # no logo
      banner: "localdev"
      footer: "-"
      whitelist-domain: localhost
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  rules:
    - http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
---
# Shared: when forwardAuth says 401 (not signed in), answer with oauth2-proxy's sign-in page
# (Google button + admin form; rd = the URL you asked for). The status stays 401: browsers
# render the page, fetch()/XHR callers get a clean 401 (a 302 would need a Location header).
# Must come BEFORE the app's forwardAuth middleware in the chain.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-errors
  namespace: auth
spec:
  errors:
    status: ["401"]
    service:
      name: oauth2-proxy
      port: 80
    query: /oauth2/sign_in?rd={url}
