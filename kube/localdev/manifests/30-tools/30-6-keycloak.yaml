# Keycloak 26 — OIDC/OAuth identity provider for *apps* (realms, clients, roles, test users).
# localdev's own SSO (oauth2-proxy) is separate and unchanged.
#
#   admin console:  http://localhost/keycloak/admin/        (behind localdev SSO; admin / LOCAL_ADMIN_PASSWORD)
#   issuer:         http://localhost/keycloak/realms/<realm> (public: login pages, token, discovery)
#   in-cluster:     http://keycloak.keycloak.svc:8080/keycloak  (backchannel: token/JWKS from pods;
#                   tokens keep the localhost issuer - KC_HOSTNAME_BACKCHANNEL_DYNAMIC)
#   realms:         keycloak/realms/*.json, applied by `mise run keycloak:apply` (keycloak-config-cli)
#
# Data: database "keycloak" on pg/postgres (runtime.data), created by the init container.
# Secret keycloak-admin comes from `mise run cluster:secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: keycloak
type: Opaque
stringData:
  # Keycloak's own DB login (dev only)
  username: keycloak
  password: keycloak
  # Postgres superuser, only used by the init container to create the role/database
  # (same fixed dev credentials as pg/postgres-app)
  pg-admin-user: app
  pg-admin-password: localdev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels: {app: keycloak}
spec:
  replicas: 1
  strategy: {type: Recreate}   # one instance at a time against the DB
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      # metrics: enabled -> /metrics on the port named "metrics" (convention, 20-4-scrape.yaml)
      labels: {app: keycloak, metrics: enabled}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: create-db       # idempotent: role + database on pg/postgres
          image: postgres:18.6
          env:
            - {name: PGHOST, value: postgres-rw.pg.svc}
            - {name: PGDATABASE, value: app}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: keycloak-db, key: pg-admin-user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db, key: pg-admin-password}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -v pw="$KC_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE keycloak LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak')\gexec
              ALTER ROLE keycloak PASSWORD :'pw';
              SELECT 'CREATE DATABASE keycloak OWNER keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
              SQL
              echo "keycloak role + database ready"
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          args: ["start"]
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgres-rw.pg.svc:5432/keycloak"}
            - name: KC_DB_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-db, key: username}}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
            # served under http://localhost/keycloak behind Traefik
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /keycloak}
            - {name: KC_HOSTNAME, value: "http://localhost/keycloak"}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            # management port 9000: /health/* (probes) and /metrics
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: /}
            # extra metrics for the official Grafana dashboards (grafana/dashboards/tools/keycloak-*):
            # per-realm user events (logins, token exchanges, ...) and HTTP latency histograms
            - {name: KC_FEATURES, value: user-event-metrics}
            - {name: KC_EVENT_METRICS_USER_ENABLED, value: "true"}
            - {name: KC_HTTP_METRICS_HISTOGRAMS_ENABLED, value: "true"}
            - {name: KC_HTTP_METRICS_SLOS, value: "250"}
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=70"}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9000}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/started, port: metrics}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: metrics}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: keycloak
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/   # signed in: 202 + identity headers; signed out: sign-in page (allow-list: 10-2-oauth2-proxy.yaml)
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
# admin console + admin REST API: behind localdev SSO (then Keycloak's own admin login)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: keycloak-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /keycloak/admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: {number: 8080}
---
# what apps and their users need, without localdev SSO: login pages, token/discovery/JWKS,
# account console, static resources
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  namespace: keycloak
spec:
  rules:
    - http:
        paths:
          - {path: /keycloak/realms, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
          - {path: /keycloak/resources, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
          - {path: /keycloak/js, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
