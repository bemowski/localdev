# Postgres 18, single instance, plain StatefulSet (no operator).
# Data lives on the host in runtime.data/postgres (mounted into the k3d server node at
# /runtime.data), so it survives `mise run recreate`; `mise run clean` wipes it.
#
# Names mirror what CloudNativePG creates for a Cluster called "postgres", so apps can
# move to CNPG later without changes:
#   Service postgres-rw (read-write endpoint), Secret postgres-app (username, password,
#   dbname, host, port, uri, jdbc-uri). Data would move with pg_dump/pg_restore.
#
# Fixed dev credentials: app / localdev, database app. Local only.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: tools
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: localdev
  dbname: app
  host: postgres-rw.tools.svc
  port: "5432"
  uri: postgresql://app:localdev@postgres-rw.tools.svc:5432/app
  jdbc-uri: jdbc:postgresql://postgres-rw.tools.svc:5432/app?user=app&password=localdev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tools
  labels: {app: postgres}
spec:
  serviceName: postgres-rw
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      # runtime.data is only mounted on the server node
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-app, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-app, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-app, key: dbname}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # PG 18 image: PGDATA=/var/lib/postgresql/18/docker
      volumes:
        - name: data
          hostPath:
            path: /runtime.data/postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: tools
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
# pgweb at /pgweb/, locked to the app database. Behind SSO (tools-sso middleware).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: tools
  labels: {app: pgweb}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgweb}
  template:
    metadata:
      labels: {app: pgweb}
    spec:
      enableServiceLinks: false
      # pgweb exits if the database isn't up yet; wait instead of crash-looping
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          command: ["sh", "-c", "until pg_isready -h postgres-rw.tools.svc -p 5432; do sleep 2; done"]
      containers:
        - name: pgweb
          image: sosedoff/pgweb:0.17.0
          args: ["--bind=0.0.0.0", "--listen=8081", "--prefix=pgweb", "--lock-session", "--no-ssh"]
          env:
            - name: PGWEB_DATABASE_URL
              value: postgres://app:localdev@postgres-rw.tools.svc:5432/app?sslmode=disable
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: {path: /pgweb/, port: 8081}
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: tools
spec:
  selector: {app: pgweb}
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgweb
  namespace: tools
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-auth-errors@kubernetescrd,tools-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /pgweb
            pathType: Prefix
            backend:
              service:
                name: pgweb
                port:
                  number: 80
