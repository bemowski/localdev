# Postgres 18, single instance, plain StatefulSet (no operator).
# Data lives on the host in runtime.data/postgres (mounted into the k3d server node at
# /runtime.data), so it survives `mise run cluster:recreate`; `mise run cluster:clean` wipes it.
#
# Names mirror what CloudNativePG creates for a Cluster called "postgres", so apps can
# move to CNPG later without changes:
#   Service postgres-rw (read-write endpoint), Secret postgres-app (username, password,
#   dbname, host, port, uri, jdbc-uri). Data would move with pg_dump/pg_restore.
#
# Fixed dev credentials: app / localdev, database app. Local only.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-app
  namespace: pg
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: localdev
  dbname: app
  host: postgres-rw.pg.svc
  port: "5432"
  uri: postgresql://app:localdev@postgres-rw.pg.svc:5432/app
  jdbc-uri: jdbc:postgresql://postgres-rw.pg.svc:5432/app?user=app&password=localdev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pg
  labels: {app: postgres}
spec:
  serviceName: postgres-rw
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      # metrics: enabled -> scraped on the port named "metrics" (convention, 20-4-scrape.yaml)
      labels: {app: postgres, metrics: enabled}
    spec:
      # runtime.data is only mounted on the server node
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: postgres
          image: postgres:18.6
          # pg_stat_statements: per-query stats for the exporter's top-queries metrics
          args: ["-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-app, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-app, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-app, key: dbname}}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          lifecycle:
            postStart:   # idempotent; initdb scripts don't run on an existing data dir
              exec:
                command: ["sh", "-c", "until pg_isready -q -U \"$POSTGRES_USER\"; do sleep 1; done; psql -q -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # PG 18 image: PGDATA=/var/lib/postgresql/18/docker
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          args:
            - --collector.stat_statements
            - --collector.stat_statements.include_query
            - --collector.stat_statements.query_length=200
            - --collector.stat_checkpointer        # PG17+ moved checkpoint stats out of bgwriter
            - --collector.postmaster               # server start time (dashboard 9628)
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/app?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom: {secretKeyRef: {name: postgres-app, key: username}}
            - name: DATA_SOURCE_PASS
              valueFrom: {secretKeyRef: {name: postgres-app, key: password}}
          ports:
            - name: metrics
              containerPort: 9187
      volumes:
        - name: data
          hostPath:
            path: /runtime.data/postgres
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: pg
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
# pgweb at /pgweb/, locked to the app database. Behind SSO (pg/sso middleware).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: pg
  labels: {app: pgweb}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgweb}
  template:
    metadata:
      labels: {app: pgweb}
    spec:
      enableServiceLinks: false
      # pgweb exits if the database isn't up yet; wait instead of crash-looping
      initContainers:
        - name: wait-for-postgres
          image: postgres:18.6
          command: ["sh", "-c", "until pg_isready -h postgres-rw.pg.svc -p 5432; do sleep 2; done"]
      containers:
        - name: pgweb
          image: sosedoff/pgweb:0.17.0
          args: ["--bind=0.0.0.0", "--listen=8081", "--prefix=pgweb", "--lock-session", "--no-ssh"]
          env:
            - name: PGWEB_DATABASE_URL
              value: postgres://app:localdev@postgres-rw.pg.svc:5432/app?sslmode=disable
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: {path: /pgweb/, port: 8081}
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: pg
spec:
  selector: {app: pgweb}
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso
  namespace: pg
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth   # allow-list: 10-2-oauth2-proxy.yaml
    authResponseHeaders: [X-Auth-Request-Email, X-Auth-Request-User]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgweb
  namespace: pg
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-auth-errors@kubernetescrd,pg-sso@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /pgweb
            pathType: Prefix
            backend:
              service:
                name: pgweb
                port:
                  number: 80
