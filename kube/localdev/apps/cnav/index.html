<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Navigator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #667085;
    --border: #e3e6eb;
    --accent: #3b6fd8;
    --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 4px 12px rgb(16 24 40 / 6%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --card: #181c24;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --border: #272c36;
      --accent: #7aa2f7;
      --shadow: 0 1px 2px rgb(0 0 0 / 40%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 40px 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 24px; margin: 0; }
  .cluster { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  a.card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 22px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .name { font-size: 17px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; }
  .link { color: var(--accent); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: auto; padding-top: 8px; }
  .error {
    padding: 16px; border: 1px solid #d92d20; border-radius: 8px; color: #d92d20;
    white-space: pre-wrap; font: 13px ui-monospace, monospace;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧭 Cluster Navigator</h1>
    <span class="cluster" id="cluster"></span>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="js-yaml.min.js"></script>
<script>
  document.getElementById('cluster').textContent = location.host;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function render(cards) {
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const c of cards) {
      const a = el('a', 'card');
      a.href = c.link;
      a.append(el('div', 'icon', c.icon || '🔗'), el('div', 'name', c.component));
      if (c.description) a.append(el('div', 'desc', c.description));
      a.append(el('div', 'link', c.link));
      grid.append(a);
    }
  }

  fetch('cards.yaml', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(`cards.yaml: HTTP ${r.status}`); return r.text(); })
    .then(text => {
      const cards = jsyaml.load(text);
      if (!Array.isArray(cards)) throw new Error('cards.yaml must be a list of cards');
      render(cards.filter(c => c && c.component && c.link));
    })
    .catch(err => {
      document.getElementById('grid').replaceWith(el('div', 'error', String(err)));
    });
</script>
</body>
</html>
