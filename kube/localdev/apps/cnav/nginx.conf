server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # served from the (ConfigMap-mountable) config dir, never cached
    location = /cards.yaml {
        root /etc/cnav;
        default_type text/yaml;
        add_header Cache-Control "no-store";
    }
}
