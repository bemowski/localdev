<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Navigator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --panel: #eef0f4;
    --text: #1d2330;
    --muted: #667085;
    --border: #e3e6eb;
    --accent: #3b6fd8;
    --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 4px 12px rgb(16 24 40 / 6%);
    --green: #12a150;
    --amber: #e09b0b;
    --red: #d92d20;
    --red-text: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218;
      --card: #181c24;
      --panel: #141820;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --border: #272c36;
      --accent: #7aa2f7;
      --shadow: 0 1px 2px rgb(0 0 0 / 40%);
      --green: #3ccf7a;
      --amber: #f5b638;
      --red: #f0645a;
      --red-text: #f58a82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout { display: flex; min-height: 100vh; }
  main { flex: 1; min-width: 0; padding: 40px 32px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; max-width: 1040px; }
  .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .user b { color: var(--text); font-weight: 600; }
  .logout {
    font: inherit; font-size: 13px; color: var(--text); text-decoration: none;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--card);
  }
  .logout:hover, .logout:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  h1 { font-size: 24px; margin: 0; }
  .cluster { color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    max-width: 1040px;
  }
  .card-wrap { position: relative; display: flex; }
  a.card {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 22px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.flyout {
    position: absolute; top: 10px; right: 10px;
    width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 7px; color: var(--muted); opacity: .55;
    transition: opacity .12s ease, background .12s ease, color .12s ease;
  }
  .card-wrap:hover a.flyout { opacity: 1; }
  a.flyout:hover, a.flyout:focus-visible { opacity: 1; color: var(--accent); background: var(--panel); outline: none; }
  a.flyout svg { width: 16px; height: 16px; }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .name { font-size: 17px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; }
  .link { color: var(--accent); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: auto; padding-top: 8px; }
  .error {
    padding: 16px; border: 1px solid var(--red); border-radius: 8px; color: var(--red-text);
    white-space: pre-wrap; font: 13px ui-monospace, monospace;
  }

  /* status column */
  aside {
    width: 340px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 40px 20px 24px;
  }
  .status-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  aside h2 { font-size: 16px; margin: 0; }
  .total { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .total-label { color: var(--muted); font: 12px system-ui, sans-serif; margin-right: 4px; }
  .total-sep { color: var(--muted); margin: 0 6px; }
  .updated { color: var(--muted); font-size: 12px; margin-bottom: 18px; }

  .group {
    margin-bottom: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .group.green { border-left-color: var(--green); }
  .group.amber { border-left-color: var(--amber); }
  .group.red { border-left-color: var(--red); }
  .group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: color-mix(in srgb, var(--panel) 60%, var(--card));
    border-bottom: 1px solid var(--border);
  }
  .group-name { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .group-count { color: var(--muted); font-size: 12px; }
  .group-mem { margin-left: auto; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .rows { padding: 4px 4px; }
  a.row, div.row {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    column-gap: 10px;
    align-items: center;
    padding: 6px 8px;
    border-radius: 6px;
    color: inherit;
    text-decoration: none;
  }
  a.row:hover { background: var(--panel); }
  .row-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-name .ns { color: var(--muted); font-weight: 400; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row-name .ns::after { content: " / "; opacity: .6; }
  .count { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .reason { grid-column: 2 / 4; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .reason.red { color: var(--red-text); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.green { background: var(--green); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    main { padding: 24px 16px; }
    aside { width: auto; height: auto; position: static; border-left: 0; border-top: 1px solid var(--border); padding: 24px 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <main>
    <header>
      <h1>🧭 Cluster Navigator</h1>
      <span class="cluster" id="cluster"></span>
      <div class="user">
        <span id="whoami"></span>
        <a class="logout" href="/oauth2/sign_out?rd=/signed-out" title="Sign out of localdev SSO">Log out</a>
      </div>
    </header>
    <div class="grid" id="grid"></div>
  </main>
  <aside>
    <div class="status-head">
      <h2>Status</h2>
      <span class="total" id="total"></span>
    </div>
    <div class="updated" id="updated">loading…</div>
    <div id="status"></div>
  </aside>
</div>
<script src="js-yaml.min.js"></script>
<script>
  const REFRESH_MS = 10000;
  document.getElementById('cluster').textContent = location.host;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // --- cards ---
  const NEW_TAB_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7"/>' +
    '<path d="M13.5 2.5 7 9"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>';

  function renderCards(cards) {
    const grid = document.getElementById('grid');
    grid.replaceChildren();
    for (const c of cards) {
      const wrap = el('div', 'card-wrap');
      const a = el('a', 'card');
      a.href = c.link;
      a.append(el('div', 'icon', c.icon || '🔗'), el('div', 'name', c.component));
      if (c.description) a.append(el('div', 'desc', c.description));
      a.append(el('div', 'link', c.link));
      const fly = el('a', 'flyout');
      fly.href = c.link;
      fly.target = '_blank';
      fly.rel = 'noopener';
      fly.title = fly.ariaLabel = `Open ${c.component} in a new tab`;
      fly.innerHTML = NEW_TAB_SVG;  // static markup, no config data
      wrap.append(a, fly);
      grid.append(wrap);
    }
  }

  // --- signed-in user (oauth2-proxy session) ---
  fetch('/oauth2/userinfo', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(u => {
      const who = document.getElementById('whoami');
      if (!u) { who.textContent = 'not signed in'; return; }
      who.replaceChildren(document.createTextNode('Signed in as '), el('b', null, u.email || u.user));
    })
    .catch(() => {});

  // 401/403 = the SSO session ended while this page was open: reload, which shows the sign-in page
  function checkAuth(r) {
    if (r.status === 401 || r.status === 403) { location.reload(); throw new Error('signed out'); }
    return r;
  }

  fetch('cards.yaml', { cache: 'no-store' })
    .then(checkAuth)
    .then(r => { if (!r.ok) throw new Error(`cards.yaml: HTTP ${r.status}`); return r.text(); })
    .then(text => {
      const cards = jsyaml.load(text);
      if (!Array.isArray(cards)) throw new Error('cards.yaml must be a list of cards');
      renderCards(cards.filter(c => c && c.component && c.link));
    })
    .catch(err => document.getElementById('grid').replaceWith(el('div', 'error', String(err))));

  // --- status ---
  function fmtMem(bytes) {
    if (bytes == null) return '';
    const mi = bytes / 2 ** 20;
    return mi >= 1024 ? `${(mi / 1024).toFixed(2)} GiB` : `${Math.round(mi)} MiB`;
  }

  function renderStatus(data) {
    const box = document.getElementById('status');
    box.replaceChildren();
    const total = document.getElementById('total');
    total.replaceChildren(el('span', 'total-label', 'pods'), document.createTextNode(fmtMem(data.mem)));
    total.title = 'pods: working-set memory of the workloads listed below (sum of the groups)';
    if (data.node_mem != null) {
      total.append(el('span', 'total-sep', '·'), el('span', 'total-label', 'node'),
                   document.createTextNode(fmtMem(data.node_mem)));
      total.title += `\nnode: the whole node(s), ${fmtMem(data.node_mem)} of ${fmtMem(data.node_alloc)} allocatable. ` +
        'Includes the k3s server process (API server, controllers, kubelet), containerd, kernel and active file cache.';
    }
    for (const g of data.groups) {
      const group = el('section', `group ${g.state}`);
      const head = el('div', 'group-head');
      head.append(el('span', `dot ${g.state}`), el('span', 'group-name', g.group),
                  el('span', 'group-count', `${g.items.length}`), el('span', 'group-mem', fmtMem(g.mem)));
      head.title = `${g.group}: ${fmtMem(g.mem)} working-set memory across ${g.items.length} items`;
      const rows = el('div', 'rows');
      for (const i of g.items) {
        const row = el(i.link ? 'a' : 'div', 'row');
        if (i.link) row.href = i.link;
        row.title = [i.link && `Open ${i.name} in Headlamp`, i.mem != null && `memory ${fmtMem(i.mem)}`]
          .filter(Boolean).join(' · ');
        const name = el('span', 'row-name');
        if (i.namespace) name.append(el('span', 'ns', i.namespace));
        name.append(document.createTextNode(i.name));
        row.append(el('span', `dot ${i.state}`), name,
                   el('span', 'count', i.desired != null ? `${i.ready}/${i.desired}` : ''));
        if (i.state !== 'green' && i.reason) row.append(el('div', `reason ${i.state}`, i.reason));
        rows.append(row);
      }
      group.append(head, rows);
      box.append(group);
    }
    const t = new Date(data.updated);
    document.getElementById('updated').textContent = `updated ${t.toLocaleTimeString()} · every ${REFRESH_MS / 1000}s`;
  }

  async function refreshStatus() {
    try {
      const r = checkAuth(await fetch('api/status', { cache: 'no-store' }));
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      renderStatus(data);
    } catch (err) {
      document.getElementById('updated').textContent = `status unavailable: ${err.message}`;
    }
  }
  refreshStatus();
  setInterval(refreshStatus, REFRESH_MS);
</script>
</body>
</html>
