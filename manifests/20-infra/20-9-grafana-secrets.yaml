# Grafana's built-in admin (the local admin), synced from the secret store (localdev-admin).
# Separate from 20-2-monitoring.yaml so the monitoring stack doesn't wait for ESO's CRDs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: localdev}
  target: {name: grafana-admin}
  data:
    - {secretKey: admin-user, remoteRef: {key: localdev-admin, property: username}}
    - {secretKey: admin-password, remoteRef: {key: localdev-admin, property: password}}
