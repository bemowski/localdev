# Customize the k3s-bundled traefik
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    # per-router (= per Ingress) request metrics for the Traefik dashboard;
    # scraped by the PodMonitor in 20-4-scrape.yaml
    metrics:
      prometheus:
        addRoutersLabels: true
