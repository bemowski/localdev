# oauth2-proxy: one SSO gate for every app. Each namespace's "sso" Middleware is a Traefik
# forwardAuth to oauth2-proxy's ROOT ("/", upstream static://202):
#   signed in  -> 202 + X-Auth-Request-* headers, request continues to the app
#   signed out -> browsers get the sign-in page (rd from X-Forwarded-*), fetch/XHR a 401
# The app's own 401s pass through untouched. (An earlier errors-middleware design turned ANY
# 401, e.g. Grafana's background token rotation, into the sign-in page - which clears the
# session cookie.)
# Two ways to sign in, on one page:
#   - Google, for accounts on the allow-list: [sso-access] in the secret store (emails and/or
#     domains), synced to Secret auth/oauth2-proxy-access by 10-3-sso-secrets.yaml
#   - local user "admin" (htpasswd), password from the secret store (localdev-admin)
# Secrets auth/oauth2-proxy, auth/oauth2-proxy-htpasswd and auth/oauth2-proxy-access are
# ExternalSecrets: 10-3-sso-secrets.yaml. With the GCP store on, auth/oauth2-proxy-google overrides
# the Google client (components/external-secrets/gcp-store.yaml.tmpl).
# Local (htpasswd) sessions have no email: the allow-list doesn't apply to them, and apps
# keyed on the email header (Grafana) show their own login instead.
apiVersion: v1
kind: Namespace
metadata:
  name: auth
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: oauth2-proxy
  namespace: kube-system
spec:
  repo: https://oauth2-proxy.github.io/manifests
  chart: oauth2-proxy
  version: 10.7.1
  targetNamespace: auth
  createNamespace: true
  valuesContent: |-
    deploymentAnnotations: {reloader.stakater.com/auto: "true"}   # roll when its secrets change
    config:
      existingSecret: oauth2-proxy
      requiredSecretKeys: []       # client + cookie come in through envFrom below, not the chart's env
      emailDomains: []             # overridden by --email-domain below (from the secret store)
      upstreams: ["static://202"]
    # Google accounts allowed into localdev, for every app: [sso-access] in the secret store.
    # emails -> this file (re-read by oauth2-proxy when it changes); domains -> --email-domain
    authenticatedEmailsFile:
      enabled: true
      persistence: secret
      template: oauth2-proxy-access
      restrictedUserAccessKey: allowed-emails
    extraEnv:
      - name: EMAIL_DOMAINS        # comma-separated, may be empty (= no domain-wide access)
        valueFrom: {secretKeyRef: {name: oauth2-proxy-access, key: email-domains}}
    # OAUTH2_PROXY_CLIENT_ID/_SECRET and _COOKIE_SECRET. A later source wins, so the Google client from
    # GCP (secrets:gcp-login) replaces the localdev store's; optional: without GCP, oauth2-proxy-google
    # doesn't exist and the localdev values apply (placeholders by default: admin login only).
    # (envFrom, not env: a duplicate env name fails the chart's server-side apply)
    envFrom:
      - secretRef: {name: oauth2-proxy}
      - secretRef: {name: oauth2-proxy-google, optional: true}
    htpasswdFile:
      enabled: true
      existingSecret: oauth2-proxy-htpasswd
    extraArgs:
      provider: google
      email-domain: $(EMAIL_DOMAINS)  # expanded by Kubernetes from the env var above
      redirect-url: http://localhost/oauth2/callback
      reverse-proxy: true
      cookie-secure: false
      set-xauthrequest: true
      skip-provider-button: false  # sign-in page: Google button + username/password form
      display-htpasswd-form: true
      custom-sign-in-logo: "-"      # no logo
      banner: "localdev"
      footer: "-"
      whitelist-domain: localhost
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: auth
spec:
  rules:
    - http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
